// ── OPEN EVENT FORM ───────────────────────────────────────────────────────────
// ── SHOW MORE (v22) — progressive disclosure for the event form ────────────
// Wraps a block of field HTML behind a "Show more ▾ / Show less ▴" toggle.
// CSS-only show/hide: every field stays present in the DOM at all times
// (just visually hidden by the wrapper div's display:none), so
// saveEvDraft() (fires every 5s while the form is open), draft-restore, and
// saveEv() all keep reading every field by document.getElementById() exactly
// as they already do today — nothing about autosave or saving needed to
// change for this feature. Mirrors two patterns already used elsewhere in
// this function (the Wellness "Exercised today" row and the Recurrence "End
// recurrence" sub-fields), which already use this exact display-toggle
// technique.
function showMoreWrap(hiddenHtml, isOpenByDefault){
  const open = !!isOpenByDefault;
  return `
    <button type="button" onclick="toggleShowMore(this)" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:${T.sage};font-size:13px;font-weight:700;cursor:pointer;padding:4px 0 10px;width:100%;text-align:left">
      <span class="sm-arrow" style="display:inline-block;font-size:11px;transition:transform .15s;transform:rotate(${open?90:0}deg)">▸</span>
      <span class="sm-label">${open?'Show less':'Show more'}</span>
    </button>
    <div class="ef-showmore" style="display:${open?'block':'none'}">${hiddenHtml}</div>`;
}
window.showMoreWrap = showMoreWrap;

// Toggles the wrapper div that immediately follows the tapped button — see
// showMoreWrap() above, where that div is always the button's next sibling.
function toggleShowMore(btn){
  const wrap = btn.nextElementSibling;
  if(!wrap) return;
  const isOpen = wrap.style.display !== 'none';
  wrap.style.display = isOpen ? 'none' : 'block';
  const arrow = btn.querySelector('.sm-arrow');
  const label = btn.querySelector('.sm-label');
  if(arrow) arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(90deg)';
  if(label) label.textContent = isOpen ? 'Show more' : 'Show less';
}
window.toggleShowMore = toggleShowMore;

function openEvForm(type, evId, dateTs, duplicateId) {
  // v18 Pass D: Subscription block-modal check. Only gates a genuinely NEW
  // event action (creating fresh, or duplicating an existing one — both
  // grow the count) — never an edit of an existing event, and never an
  // internal re-render mid-edit (type switch, health sub-type switch, or a
  // draft restore), since those aren't creating anything new.
  const _isInternalReload = !!(A._pendingTypeSwitchSource || A._healthOverride || A._evDraftRestore);
  if (!evId && !_isInternalReload && _isAtEventLimit()) {
    showModal('Event limit reached', `
      <div style="text-align:center;padding:6px 0 4px">
        <div style="font-size:13px;color:${T.ink};line-height:1.5">
          You've reached your Events limit on the Free plan. Delete an existing event to add a new one, or upgrade for unlimited events.
        </div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn btn-secondary btn-full" onclick="_closeModalDOM()">Manage existing</button>
          <button class="btn btn-full" disabled style="background:#e5e0d5;color:#a89f8f;cursor:not-allowed;opacity:0.7">Upgrade — Coming soon</button>
        </div>
      </div>`);
    return;
  }
  const ev = evId ? A.events.find(e=>e.id===evId) : null;
  const dupEv = duplicateId ? A.events.find(e=>e.id===duplicateId) : null;
  // If health override set (from type switcher), use it
  const healthOverride = (type === 'health' && A._healthOverride) ? A._healthOverride : null;
  // v18 (Event Type Switcher): if a cross-type switch was just confirmed,
  // this holds the converted common-field values (title, date, participants,
  // tags, description, actions, links, etc.) built from whatever was on
  // screen before the switch — takes priority over the DB row or duplicate
  // source, since it reflects the user's just-confirmed, possibly-unsaved edits.
  const typeSwitchSource = A._pendingTypeSwitchSource || null;
  const source = typeSwitchSource || healthOverride || dupEv || ev; // source for pre-filling fields
  const cfg = ET[type];

  // v22.1 fix: it was previously unclear, once inside the edit form, whether
  // you were editing the full recurring series or just one occurrence — and
  // the Recurrence fields kept showing/accepting edits either way, even
  // though changing them only actually does anything in full-series mode
  // (single-occurrence saves silently write recurrence values back onto
  // just that one row with no effect, risking that row's own recurrence
  // columns drifting out of sync with its siblings). `A._editSeriesMode` is
  // the existing flag set by showRecurrenceEditChoice() when "Edit all
  // occurrences" is chosen; its absence (for an existing event that IS part
  // of a series) means we're in single-occurrence mode.
  const isEditingFullSeries = !!A._editSeriesMode;
  const isSingleOccurrenceEdit = !!(ev && ev.series_id && !isEditingFullSeries);
  let recurrenceModeLabel = '';
  if (ev && ev.series_id) {
    const seriesCount = A.events.filter(e => e.series_id === ev.series_id).length;
    recurrenceModeLabel = isEditingFullSeries
      ? `<div style="background:${T.skyLight};color:${T.sky};border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px">🔁 You're editing the full recurring series (${seriesCount} occurrence${seriesCount!==1?'s':''})</div>`
      : `<div style="background:${T.honeyLight};color:${T.honey};border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px">📌 You're editing this occurrence only</div>`;
  }

  // DATE/TIME DEFAULTS
  // Fix date offset: use local ISO, not UTC-shifted
  const nowD = new Date();
  // v21 fix (found in staging testing of Quick Add, then confirmed as a
  // wider issue): this previously truncated to the current hour, so a
  // brand-new timed event always defaulted to a start time already in the
  // past (e.g. opened at 21:25 -> defaulted to 21:00). Nobody plans an
  // event that already started — this now rounds UP to the next full hour
  // instead. Day rollover past 23:00 (e.g. 23:40 -> tomorrow 00:00) only
  // applies when no specific date was already chosen (dateTs null, e.g.
  // the general "+ Add" entry point) — tapping a specific day on the
  // Calendar always keeps that exact day, regardless of the current time;
  // in that case the hour is simply capped at 23:00 instead of wrapping.
  let defHour = nowD.getHours() + 1;
  let defDateD = nowD;
  if (defHour >= 24) {
    if (dateTs) { defHour = 23; }
    else { defHour = 0; defDateD = addDays(nowD, 1); }
  }
  const iDate = dateTs ? toISOLocal(new Date(dateTs)) : toISOLocal(defDateD);
  const defST = String(defHour).padStart(2,'0') + ':00';
  const defET = String(Math.min(defHour+1,23)).padStart(2,'0') + ':00';

  const evDate = source ? toISOLocal(new Date(source.date)) : '';
  const evTime = source ? new Date(source.date).toTimeString().slice(0,5) : '';
  const evEndDate = source?.end_date ? toISOLocal(new Date(source.end_date)) : '';
  const evEndTime = source?.end_date ? new Date(source.end_date).toTimeString().slice(0,5) : '';
  // If health type was switched, use captured dates (preserve user's selection)
  const _pd = A._pendingHealthData;
  // For duplicate: use today's date
  const startDate = (_pd?._curDate) || (dupEv ? iDate : (evDate || iDate));
  const startTime = (_pd?._curSTime) || (dupEv ? defST : (evTime || defST));
  const endDate = (_pd?._curEndDate) || (dupEv ? iDate : (evEndDate || startDate));
  const endTime = (_pd?._curETime) || (dupEv ? defET : (evEndTime || defET));
  // V13: tasks default to All Day (preserves old "blank time = all-day" behaviour);

  const isAllDay = dupEv ? false : (source ? !!source.all_day : (type === 'task'));

      // sub-type switcher, Participants, Title, Start/End Date,

      const _smMain = `
        <div class="form-row"><label class="lbl">Health Event Type</label>
          <select class="sel" id="ef-apt" onchange="confirmHealthSubTypeSwitch(this.value,'${hType}','${evId||''}',${dateTs||'null'})">

          <div style="position:relative"><input class="inp" id="ef-title" value="${source?.title||''}" placeholder="e.g. Antibiotic course"></div></div>
        <div class="grid2">
          <div class="form-row" style="margin:0"><label class="lbl">Start Date</label><input class="inp" type="date" id="ef-date" value="${startDate}" onchange="syncEndDate(this.value)"></div>
          <div class="form-row" style="margin:0"><label class="lbl">End Date</label><input class="inp" type="date" id="ef-enddate" value="${endDate}"></div>
        </div>
        <div class="form-row"><label class="lbl">Considerations</label><textarea class="inp" id="ef-considerations" rows="2" placeholder="Reactions, restrictions (e.g. take with food)…" style="resize:none">${source?.considerations||''}</textarea></div>
        <div class="form-row"><label class="lbl">Administration</label>
          <div id="ef-admin"></div>
          <button type="button" onclick="addAdminRow('ef-admin')" style="font-size:12px;color:${T.sage};background:none;border:1px dashed ${T.sageMid};border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:600;margin-top:4px">+ Add dosage</button>
        </div>`;
      const _smHidden = `
        ${recurrenceFields(source?.recurrence, source?.recurrence_end_type, source?.recurrence_end_count, source?.recurrence_end_date, isSingleOccurrenceEdit)}
        <div class="form-row"><label class="lbl">Recommended by</label><input class="inp" id="ef-recby" value="${source?.recommended_by||''}" placeholder="Dr. name"></div>
        <div class="form-row"><label class="lbl">Tags</label>${tagButtons()}</div>
        ${attachmentField()}`;
      const _smOpen = !!((source?.recurrence && source.recurrence!=='None') || source?.recommended_by || (source?.tags&&source.tags.length) || (source?.links&&source.links.length));
      fields = _smMain + showMoreWrap(_smHidden, _smOpen);

    } else { // Illness
      // v22 (Show more): Main = sub-type switcher, Participants, Title,
      // Start/End Date, Symptoms. Hidden = Cure/Treatment, Tags, Attachments.
      const _smMain = `
        <div class="form-row"><label class="lbl">Health Event Type</label>
          <select class="sel" id="ef-apt" onchange="confirmHealthSubTypeSwitch(this.value,'${hType}','${evId||''}',${dateTs||'null'})">
            ${['Appointment','Treatment','Illness'].map(t=>`<option${hType===t?' selected':''}>${t}</option>`).join('')}
          </select></div>
        <div class="form-row"><label class="lbl">Participants</label>${partButtons()}</div>
        <div class="form-row"><label class="lbl">Title</label>
          <div style="position:relative"><input class="inp" id="ef-title" value="${source?.title||''}" placeholder="e.g. Flu"></div></div>
        <div class="grid2">
          <div class="form-row" style="margin:0"><label class="lbl">Start Date</label><input class="inp" type="date" id="ef-date" value="${startDate}" onchange="syncEndDate(this.value)"></div>
          <div class="form-row" style="margin:0"><label class="lbl">End Date</label><input class="inp" type="date" id="ef-enddate" value="${endDate}"></div>
        </div>
        <div class="form-row"><label class="lbl">Symptoms</label><textarea class="inp" id="ef-symptoms" rows="2" placeholder="Describe symptoms…" style="resize:none">${source?.symptoms||''}</textarea></div>`;
      const _smHidden = `
        <div class="form-row"><label class="lbl">Cure / Treatment</label><textarea class="inp" id="ef-cure" rows="2" placeholder="Treatment applied…" style="resize:none">${source?.cure||''}</textarea></div>
        <div class="form-row"><label class="lbl">Tags</label>${tagButtons()}</div>
        ${attachmentField()}`;
      const _smOpen = !!(source?.cure || (source?.tags&&source.tags.length) || (source?.links&&source.links.length));
      fields = _smMain + showMoreWrap(_smHidden, _smOpen);
    }

  // ── TASK ──
  } else if (type === 'task') {
    // v22 (Anyone/All unification): Task now uses the same
    // participants[]/participants_all_family model and partButtons() UI as
    // Social/Health — one person, several people, or the whole family —
    // instead of the old single-assignee dropdown. Label changed from
    // "Assign To" to "Participants" to match exactly.
    const _smMain = `
      <div class="form-row"><label class="lbl">Participants</label>${partButtons()}</div>
      <div class="form-row"><label class="lbl">Title</label>
        <div style="position:relative"><input class="inp" id="ef-title" value="${source?.title||''}" placeholder="Add a title…"></div></div>
      <div class="form-row"><label class="lbl">Location</label>
        <div style="position:relative"><input class="inp" id="ef-loc" value="${source?.location||''}" placeholder="Where?"></div></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px;cursor:pointer">
        <input type="checkbox" id="ef-allday" ${isAllDay?'checked':''} onchange="toggleAllDay(this.checked)"> All day (no specific time)
      </label>
      <div class="grid2">
        <div class="form-row" style="margin:0"><label class="lbl">Due Date</label>
          <input class="inp" type="date" id="ef-date" value="${evDate||iDate}"></div>
        <div class="form-row" style="margin:0" id="ef-stime-row"><label class="lbl">Time</label>
          ${buildTimeSelect('ef-stime', source?.date&&!source?.all_day?new Date(source.date).toTimeString().slice(0,5):defST)}</div>
      </div>
      <div class="form-row"><label class="lbl">Actions / Subtasks</label>
        <div id="ef-actions"></div>
        <button type="button" onclick="addChecklistRow('ef-actions')" style="font-size:12px;color:${T.sage};background:none;border:1px dashed ${T.sageMid};border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:600;margin-top:4px">+ Add item</button>
      </div>`;
    const _smHidden = `
      ${recurrenceFields(source?.recurrence, source?.recurrence_end_type, source?.recurrence_end_count, source?.recurrence_end_date, isSingleOccurrenceEdit)}
      <div class="form-row"><label class="lbl">Tags</label>${tagButtons()}</div>
      <div class="form-row"><label class="lbl">Description</label><textarea class="inp" id="ef-desc" rows="2" placeholder="Any notes…" style="resize:none">${source?.description||''}</textarea></div>
      ${attachmentField()}`;
    const _smOpen = !!((source?.recurrence && source.recurrence!=='None') || (source?.tags&&source.tags.length) || source?.description || (source?.links&&source.links.length));
    fields = _smMain + showMoreWrap(_smHidden, _smOpen);
  }

  // v18 (Event Type Switcher): a dropdown to switch this event between
  // Task / Social Event / Health Event, available both for brand-new
  // (unsaved) events and existing (saved) ones being edited. Wellness is
  // deliberately excluded — it's a per-day per-member log, not a general
  // switchable event type. Placed at the very top of the form.
  if (type === 'task' || type === 'social' || type === 'health') {
    const typeSwitcherHtml = `
      <div class="form-row"><label class="lbl">Event Type</label>
        <select class="sel" id="ef-type-switch" onchange="confirmTypeSwitch(this.value,'${type}','${evId||''}',${dateTs||'null'})">
          <option value="task"${type==='task'?' selected':''}>Task</option>
          <option value="social"${type==='social'?' selected':''}>Event</option>
          <option value="health"${type==='health'?' selected':''}>Health Event</option>
        </select></div>`;
    fields = typeSwitcherHtml + fields;
  }

  const isDup = !!duplicateId;
  // v8: show the privacy toggle only when creating a new event OR
  // when the current user is the original creator of an existing one.
  // Duplicates are treated as new events — toggle shown, unchecked.
  const _showEvPriv = !evId || (ev && ev.created_by_user_id === A.user?.id);
  const privToggleHtml = _showEvPriv
    ? `<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:4px 0 12px;cursor:pointer;background:${T.parchment};border-radius:9px;padding:10px 12px;border:1px solid ${T.border}">
        <input type="checkbox" id="ef-private" ${(!isDup && ev?.is_private) ? 'checked' : ''}>
        🔒 Private — only visible to you
      </label>`
    : '';
  showModal(`${isDup?'Duplicate':(ev?'Edit':'New')} ${cfg.label}`, `
    <div style="display:flex;flex-direction:column">
      ${recurrenceModeLabel}
      ${fields}
      ${privToggleHtml}
      <button class="btn btn-primary btn-full btn-lg" style="margin-top:8px" onclick="saveEv('${type}','${isDup?'':evId||''}',${dateTs||'null'})">
        ${isDup||!ev ? 'Add Entry' : 'Save Changes'}
      </button>
    </div>`);

  // Clear any pending health reload data
  delete A._pendingHealthData;
  // v18: clear the pending type-switch source now that it's been consumed
  delete A._pendingTypeSwitchSource;

  // Post-render setup
  setTimeout(() => {
    // v13: track event type and start periodic draft saving every 5 seconds
    A._evDraftType = type;
    // v18 (Draft Safety Fix C1): also track which existing event (if any) is
    // being edited, so a draft saved from this form knows to restore back
    // into THIS event rather than always opening a blank new-event form.
    // null for a genuinely new event or a duplicate (both correctly treated
    // as "new" on restore).
    A._evDraftEditingId = evId || null;
    clearInterval(A._evDraftInterval);
    A._evDraftInterval = setInterval(saveEvDraft, 5000);
    // v13: if a draft was queued by restoreEvDraft(), populate the form fields now.
    // Time fields (ef-stime/ef-etime) are restored separately via setTimeVal() —
    // they're now hour/minute select pairs, not single inputs with a .value.
    if (A._evDraftRestore) {
      const _dr = A._evDraftRestore;
      delete A._evDraftRestore;
      // Restore text, select, and number fields (time fields excluded — handled below)
      ['ef-title','ef-date','ef-enddate','ef-loc','ef-social-type',
       'ef-desc','ef-mem','ef-rec','ef-recend-n','ef-recend-d',
       'ef-wt','ef-ht','ef-hyd','ef-act','ef-actm','ef-mood','ef-en','ef-sl','ef-wcomment',
       'ef-doctor','ef-specialty','ef-cost','ef-cost-cur','ef-recby','ef-considerations',
       'ef-symptoms','ef-cure'].forEach(id=>{
        const el=document.getElementById(id);
        if(el&&_dr.fields?.[id]!==undefined) el.value=_dr.fields[id];
      });
      // Restore the two time-picker fields via setTimeVal (hour + minute selects)
      if (_dr.fields?.['ef-stime'] !== undefined) setTimeVal('ef-stime', _dr.fields['ef-stime']);
      if (_dr.fields?.['ef-etime'] !== undefined) setTimeVal('ef-etime', _dr.fields['ef-etime']);
      // Restore checkbox fields and trigger their visual side-effects
      ['ef-allday','ef-ex','ef-private'].forEach(id=>{
        const el=document.getElementById(id);
        if(el&&_dr.fields?.[id]!==undefined){
          el.checked=_dr.fields[id];
          if(id==='ef-allday') toggleAllDay(el.checked);
          if(id==='ef-ex'){const row=document.getElementById('ef-exrow');if(row)row.style.display=el.checked?'grid':'none';}
        }
      });
      // Restore participant button selections
      (_dr.participants||[]).forEach(mid=>{
        const btn=document.querySelector(`#ef-parts button[data-mid="${mid}"]`);
        if(btn&&btn.dataset.sel!=='true') togPart(btn,mid);
      });
      // Restore tag button selections
      (_dr.tags||[]).forEach(tag=>{
        const btn=document.querySelector(`#ef-tags button[data-tag="${tag}"]`);
        if(btn&&btn.dataset.sel!=='true') togTag(btn);
      });
      // Restore recurrence end type visibility
      if(_dr.fields?.['ef-recend-type']){
        const rEl=document.getElementById('ef-recend-type');
        if(rEl){rEl.value=_dr.fields['ef-recend-type'];updateRecurrenceEndType(rEl.value);}
      }
      if(_dr.fields?.['ef-rec']&&_dr.fields['ef-rec']!=='None') updateRecurrenceEnd(_dr.fields['ef-rec']);
      // v18: type-switch Cancel reuses this exact restore mechanism to put
      // the original form back exactly as it was — but that's not really a
      // "draft restored" event from the user's point of view, so it sets
      // this flag to suppress the toast just for that one case.
      if (A._suppressDraftRestoreToast) { delete A._suppressDraftRestoreToast; }
      else { toast('Draft restored ✓'); }
    }
    // Autocomplete
    if (document.getElementById('ef-title')) buildAutocomplete('ef-title', type, 'title');
    // Store initial start date for smart end-date calculation
    const sdInp = document.getElementById('ef-date');
    if (sdInp) sdInp.dataset.prevDate = sdInp.value;
    if (document.getElementById('ef-loc')) buildAutocomplete('ef-loc', type, 'location');
    if (document.getElementById('ef-doctor')) buildAutocomplete('ef-doctor', 'health', 'doctor');
    // All-day visibility
    toggleAllDay(isAllDay);
    // Pre-populate checklists
    if (document.getElementById('ef-actions')) {
      const acts = source?.actions || [];
      acts.forEach(a => addChecklistRow('ef-actions', a.text, a.done));
    }
    if (document.getElementById('ef-admin')) {
      const admin = source?.administration || [];
      if (admin.length) admin.forEach(r => addAdminRow('ef-admin', r.units, r.timing));
      else addAdminRow('ef-admin');
    }
    // Wellness prefill
    if (type === 'wellness' && !ev) {
      const memSel = document.getElementById('ef-mem');
      if (memSel?.value) prefillWellness(memSel.value);
    }
    // V13: wire up Start Time selects to auto-advance the End Time selects by
    // 1 hour, same behaviour as the old native <input type="time"> onchange.
    // Only applies to Social/Health forms which have both ef-stime and ef-etime.
    const stHourSel = document.getElementById('ef-stime-h');
    const stMinSel = document.getElementById('ef-stime-m');
    if (stHourSel && document.getElementById('ef-etime-h')) {
      const handler = () => syncEndTime(getTimeVal('ef-stime'));
      stHourSel.addEventListener('change', handler);
      stMinSel?.addEventListener('change', handler);
    }
  }, 80);
}
window.openEvForm = openEvForm;

function reloadHealthForm(newType, evId, dateTs) {
  // Capture all current field values before reloading
  const curDate = document.getElementById('ef-date')?.value;
  const curEndDate = document.getElementById('ef-enddate')?.value;
  // V13: read via getTimeVal() — ef-stime/ef-etime are now hour/minute select
  // pairs, not single inputs with a .value (native time input was removed).
  const curSTime = getTimeVal('ef-stime');
  const curETime = getTimeVal('ef-etime');
  const title = document.getElementById('ef-title')?.value || '';
  const loc = document.getElementById('ef-loc')?.value || '';
  const desc = document.getElementById('ef-desc')?.value || '';
  // v18 fix: Participants, Tags, Actions, and Attachments are common to
  // every Health sub-type (Appointment/Treatment/Illness all render them) —
  // but were never captured here, only title/location/description/dates.
  // That meant switching sub-type silently lost them, since the fallback
  // (the underlying `ev`, if any) doesn't reflect a not-yet-saved switch.
  const partBtns = Array.from(document.querySelectorAll('#ef-parts button[data-sel="true"]'));
  const participants_all_family = partBtns.some(b=>b.dataset.mid==='__family__');
  const participants = partBtns.filter(b=>b.dataset.mid!=='__family__').map(b=>b.dataset.mid).filter(Boolean);
  const tags = Array.from(document.querySelectorAll('#ef-tags button[data-sel="true"]')).map(b=>b.dataset.tag).filter(Boolean);
  A._pendingHealthData = { title, location: loc, description: desc,
    participants, participants_all_family, tags,
    _curDate: curDate, _curEndDate: curEndDate, _curSTime: curSTime, _curETime: curETime };
  // Only include actions/links if the CURRENT sub-type actually renders them
  // (only Appointment does) — omitting the key entirely when it doesn't,
  // rather than setting it to undefined, so the merge in openEvFormHealth()
  // falls through to the underlying event's real saved value instead of
  // clobbering it with undefined.
  if (document.getElementById('ef-actions')) A._pendingHealthData.actions = getChecklist('ef-actions');
  if (document.getElementById('ef-links')) A._pendingHealthData.links = getLinks();
  openEvFormHealth(newType, evId, dateTs);
}
window.reloadHealthForm = reloadHealthForm;

function openEvFormHealth(apptType, evId, dateTs) {
  // Build a fake event object or use real one, with overridden appt_type
  const ev = evId ? getEvents().find(e=>e.id===evId) : null;
  const pending = A._pendingHealthData || {};
  const overrideEv = ev ? {...ev, appt_type: apptType, ...pending} : {appt_type: apptType, ...pending};
  // Temporarily store so openEvForm picks it up
  A._healthOverride = overrideEv;
  openEvForm('health', evId, dateTs);
  delete A._healthOverride;
}
window.openEvFormHealth = openEvFormHealth;

// ── HEALTH SUB-TYPE SWITCH CONFIRMATION (v18 fix) ─────────────────────────────
// Appointment / Treatment / Illness have genuinely different fields (Doctor/
// Specialty/Cost only on Appointment; Administration/Recommended By/
// Considerations only on Treatment; Symptoms/Cure only on Illness) — so
// switching between them can silently clear real data, the same problem the
// top-level Task/Social/Health switcher already solves. This mirrors that
// same pattern one level down. (Social's own sub-type — event category —
// doesn't need this: every Social sub-type renders identical fields, so
// nothing is ever lost switching between them.)
function confirmHealthSubTypeSwitch(newSubType, oldSubType, evId, dateTs){
  if(!newSubType || newSubType===oldSubType) return;
  // Capture the full form NOW, before the confirmation modal (if shown)
  // replaces this form's DOM — same reasoning as the top-level switcher's
  // v18.2 fix. Both Cancel and the actual switch read from this snapshot.
  const snapshot = _captureEvFormFields();
  A._healthSubTypeSwitchSnapshot = snapshot;

  // Skip the confirmation entirely for a genuinely blank, brand-new event —
  // nothing to lose, so just switch. Same reasoning as the top-level switcher.
  if (!evId) {
    const f = snapshot.fields || {};
    const textFieldsBlank = ['ef-title','ef-loc','ef-desc',
      'ef-doctor','ef-specialty','ef-cost','ef-symptoms','ef-cure',
      'ef-recby','ef-considerations'].every(id => !(f[id]??'').toString().trim());
    const isFormBlank = textFieldsBlank
      && !(snapshot.participants||[]).length
      && !(snapshot.tags||[]).length
      && !(snapshot.actions||[]).length
      && !(snapshot.links||[]).length;
    if (isFormBlank) { _confirmedHealthSubTypeSwitch(newSubType, evId, dateTs); return; }
  }

  // Only mention fields actually filled in that are exclusive to the
  // sub-type being switched away from — same short, specific wording style
  // as the top-level switcher.
  const f = snapshot.fields || {};
  const filledLabels = [];
  if (oldSubType === 'Appointment') {
    if ((f['ef-doctor']??'').toString().trim()) filledLabels.push('Doctor');
    if ((f['ef-specialty']??'').toString().trim()) filledLabels.push('Specialty');
    if ((f['ef-cost']??'').toString().trim()) filledLabels.push('Cost');
  } else if (oldSubType === 'Treatment') {
    if ((f['ef-recby']??'').toString().trim()) filledLabels.push('Recommended By');
    if ((f['ef-considerations']??'').toString().trim()) filledLabels.push('Considerations');
    // Administration rows are a dynamic row-list (like Actions/Attachments),
    // not a simple field in the snapshot — check the live DOM directly,
    // right now, before it's replaced.
    if (document.getElementById('ef-admin') && getAdminRows('ef-admin').length) {
      filledLabels.push('Administration/Dosage');
    }
  } else if (oldSubType === 'Illness') {
    if ((f['ef-symptoms']??'').toString().trim()) filledLabels.push('Symptoms');
    if ((f['ef-cure']??'').toString().trim()) filledLabels.push('Cure/Treatment');
  }

  const bodyText = filledLabels.length
    ? `Switch to <b>${newSubType}</b>? This will clear: <b>${filledLabels.join(', ')}</b>.`
    : `Switch this event to <b>${newSubType}</b>? Your entered details will carry over.`;

  // Register a cancel handler so closing this modal ANY way (✕, tap-outside,
  // back button) returns to the form instead of losing it — same fix as the
  // top-level switcher.
  A._modalCancelHandler = () => cancelHealthSubTypeSwitch(oldSubType, evId, dateTs);

  showModal('Change Health Sub-Type', `
    <div style="text-align:center;padding:6px 0 4px">
      <div style="font-size:13px;color:${T.ink};line-height:1.5">${bodyText}</div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-secondary btn-full" onclick="cancelHealthSubTypeSwitch('${oldSubType}','${evId||''}',${dateTs||'null'})">Cancel</button>
        <button class="btn btn-primary btn-full" onclick="_confirmedHealthSubTypeSwitch('${newSubType}','${evId||''}',${dateTs||'null'})">Change Type</button>
      </div>
    </div>`);
}
window.confirmHealthSubTypeSwitch = confirmHealthSubTypeSwitch;

// Cancel: reopen the SAME sub-type, restoring the exact snapshot captured
// above via the existing draft-restore field-application mechanism.
function cancelHealthSubTypeSwitch(oldSubType, evId, dateTs){
  A._modalCancelHandler = null;
  const snap = A._healthSubTypeSwitchSnapshot;
  delete A._healthSubTypeSwitchSnapshot;
  _closeModalDOM();
  A._evDraftType = 'health';
  if (snap) {
    A._evDraftRestore = snap;
    A._suppressDraftRestoreToast = true;
  }
  openEvFormHealth(oldSubType, evId||null, dateTs);
}
window.cancelHealthSubTypeSwitch = cancelHealthSubTypeSwitch;

// Confirm: build the pending-override object from the ALREADY-captured
// snapshot (not live DOM — by the time this runs, the confirmation modal
// has already replaced the form, same lesson as the top-level switcher).
function _confirmedHealthSubTypeSwitch(newSubType, evId, dateTs){
  A._modalCancelHandler = null;
  const snap = A._healthSubTypeSwitchSnapshot || { fields:{}, participants:[], tags:[], actions:[], links:[] };
  delete A._healthSubTypeSwitchSnapshot;
  const f = snap.fields || {};
  const isFamily = (snap.participants||[]).includes('__family__');
  const memberIds = (snap.participants||[]).filter(p=>p!=='__family__');
  A._pendingHealthData = {
    title: f['ef-title'] || '',
    location: f['ef-loc'] || '',
    description: f['ef-desc'] || '',
    participants: memberIds,
    participants_all_family: isFamily,
    tags: snap.tags || [],
    _curDate: f['ef-date'] || '',
    _curEndDate: f['ef-enddate'] || '',
    _curSTime: f['ef-stime'] || '',
    _curETime: f['ef-etime'] || '',
  };
  // Only include actions/links if something was actually captured — omit
  // the key entirely otherwise (rather than an empty array) so a later
  // merge against a real saved event's data doesn't clobber it. See the
  // matching note in reloadHealthForm().
  if (snap.actions && snap.actions.length) A._pendingHealthData.actions = snap.actions;
  if (snap.links && snap.links.length) A._pendingHealthData.links = snap.links;
  _closeModalDOM();
  openEvFormHealth(newSubType, evId||null, dateTs);
}
window._confirmedHealthSubTypeSwitch = _confirmedHealthSubTypeSwitch;

function openEvFormWithType(type, evId, dateTs, forceApptType) {

}
window.openEvFormWithType = openEvFormWithType;

// ── EVENT TYPE SWITCHER (v18) ─────────────────────────────────────────────────
// Lets a user change an event's type (Task / Social / Health) directly from
// the create/edit popup, instead of discarding it and starting over. Same
// database row/id is kept — this is an UPDATE, not delete+recreate.

// Captures every currently-rendered form field, in the same shape as the
// localStorage draft system ({fields, participants, tags}). Used so that
// cancelling a type switch can restore the exact in-progress form the user
// had, untouched, with the dropdown reverted to the original type. Kept as
// its own small function (rather than reusing saveEvDraft()'s internals) to
// keep this feature self-contained and avoid touching that function again
// this sprint.
function _captureEvFormFields(){
  const fieldIds=[
    'ef-title','ef-date','ef-enddate','ef-allday',
    'ef-loc','ef-social-type','ef-desc','ef-mem','ef-rec',
    'ef-recend-type','ef-recend-n','ef-recend-d',
    'ef-wt','ef-ht','ef-hyd','ef-ex','ef-act','ef-actm','ef-mood','ef-en','ef-sl','ef-wcomment',
    'ef-apt','ef-doctor','ef-specialty','ef-cost','ef-cost-cur',
    'ef-symptoms','ef-cure','ef-recby','ef-considerations','ef-private'
  ];
  const fields={};
  fieldIds.forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    fields[id]=el.type==='checkbox'?el.checked:el.value;
  });
  const stimeVal=getTimeVal('ef-stime');
  if(stimeVal) fields['ef-stime']=stimeVal;
  const etimeVal=getTimeVal('ef-etime');
  if(etimeVal) fields['ef-etime']=etimeVal;
  const participants=Array.from(document.querySelectorAll('#ef-parts button[data-sel="true"]')).map(b=>b.dataset.mid).filter(Boolean);
  const tags=Array.from(document.querySelectorAll('#ef-tags button[data-sel="true"]')).map(b=>b.dataset.tag).filter(Boolean);
  // v18.2 fix: also capture Actions/checklist and Attachments live, right
  // now, while the form's DOM still exists. This matters because the Type
  // Switcher's confirmation modal replaces this form's entire DOM before
  // either Cancel or Confirm is clicked — anything not captured here is
  // gone by the time those handlers run.
  const actions = document.getElementById('ef-actions') ? getChecklist('ef-actions') : [];
  const links = document.getElementById('ef-links') ? getLinks() : [];
  return { fields, participants, tags, actions, links };
}

// Fired by the "Event Type" dropdown's onchange. Shows the confirmation
// modal before anything actually changes.
function confirmTypeSwitch(newType, oldType, evId, dateTs){
  if(!newType || newType===oldType) return;
  // v18.2 fix: capture the FULL current form state — once, right now,
  // before showModal() below replaces this form's DOM. Both Cancel and
  // Confirm read from this same snapshot afterward; neither can safely read
  // live DOM anymore once the confirmation modal is showing. (This was the
  // root cause of the "fields get cleared" bug reported after Pass C —
  // switchEventType() was reading document.getElementById(...) for fields
  // that had already been removed from the page by the time it ran.)
  A._typeSwitchSnapshot = _captureEvFormFields();

  // v18 fix: if this is a brand-new (never-saved) event and truly nothing
  // has been entered anywhere in the form yet, there's no "migration"
  // happening at all — the user is just picking a different starting point
  // before they've begun. Skip the confirmation entirely and switch right
  // away. (Only applies to unsaved events — evId existing means a title was
  // already required to save it originally, and there's real saved state
  // like recurrence/series membership worth still confirming about.)
  if (!evId) {
    const f = A._typeSwitchSnapshot.fields || {};
    const snap = A._typeSwitchSnapshot;
    const textFieldsBlank = ['ef-title','ef-loc','ef-desc','ef-social-type',
      'ef-doctor','ef-specialty','ef-cost','ef-symptoms','ef-cure',
      'ef-recby','ef-considerations'].every(id => !(f[id]??'').toString().trim());
    const isFormBlank = textFieldsBlank
      && !(snap.participants||[]).length
      && !(snap.tags||[]).length
      && !(snap.actions||[]).length
      && !(snap.links||[]).length;
    if (isFormBlank) {
      switchEventType(newType, oldType, evId, dateTs);
      return;
    }
  }

  const existingEv = evId ? A.events.find(e=>e.id===evId) : null;
  const isFullSeriesEdit = !!A._editSeriesMode;
  const isSingleOccurrenceOfSeries = !!(existingEv && existingEv.series_id && !isFullSeriesEdit);

  const oldLabel = ET[oldType]?.label || oldType;
  const newLabel = ET[newType]?.label || newType;
  let extraLine = '';
  if (isFullSeriesEdit) {
    extraLine = `<div style="font-size:12px;color:${T.muted};margin-top:8px">This will change the entire recurring series.</div>`;
  } else if (isSingleOccurrenceOfSeries) {
    extraLine = `<div style="font-size:12px;color:${T.muted};margin-top:8px">This occurrence will be detached from its series.</div>`;
  }

  // Pass D fix: v18.2's wording was still too long, and always listed every
  // "kept" field even when nothing was ever going to be lost. Now: check
  // which fields exclusive to the OLD type actually have something entered
  // in them (per the captured snapshot), and only mention THOSE, by name.
  // If nothing filled-in would actually be lost — which includes every
  // switch away from Task, since Task has no type-exclusive fields at all —
  // skip the warning entirely and just confirm the switch.
  const EXCLUSIVE_FIELD_LABELS = {
    social: { 'ef-social-type': 'Event Category' },
    health: {
      'ef-doctor':'Doctor','ef-specialty':'Specialty','ef-cost':'Cost',
      'ef-symptoms':'Symptoms','ef-cure':'Cure/Treatment',
      'ef-recby':'Recommended By','ef-considerations':'Considerations'
    },
  };
  const fieldMap = EXCLUSIVE_FIELD_LABELS[oldType] || {};
  const snapFields = A._typeSwitchSnapshot.fields || {};
  const filledLabels = Object.keys(fieldMap)
    .filter(id => (snapFields[id] ?? '').toString().trim())
    .map(id => fieldMap[id]);

  const bodyText = filledLabels.length
    ? `Switch to <b>${newLabel}</b>? This will clear: <b>${filledLabels.join(', ')}</b>.`
    : `Switch this event to <b>${newLabel}</b>? Your entered details will carry over.`;

  // Pass D fix: register a cancel handler so closing this modal ANY way
  // (✕, tap-outside, back button) — not just the explicit Cancel button —
  // returns to the original form instead of losing the event entirely.
  // See _closeModalDOM() for the dispatch logic.
  A._modalCancelHandler = () => cancelTypeSwitch(oldType, evId, dateTs);

  showModal('Change Event Type', `
    <div style="text-align:center;padding:6px 0 4px">
      <div style="font-size:13px;color:${T.ink};line-height:1.5">
        ${bodyText}
      </div>
      ${extraLine}
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-secondary btn-full" onclick="cancelTypeSwitch('${oldType}','${evId||''}',${dateTs||'null'})">Cancel</button>
        <button class="btn btn-primary btn-full" onclick="switchEventType('${newType}','${oldType}','${evId||''}',${dateTs||'null'})">Change Type</button>
      </div>
    </div>`);
}
window.confirmTypeSwitch = confirmTypeSwitch;

// Cancel: reopen the same type, restoring the exact snapshot captured above
// (reusing the existing draft-restore field-application mechanism inside
// openEvForm(), with its toast suppressed for this case).
function cancelTypeSwitch(oldType, evId, dateTs){
  // Pass D fix: clear the cancel handler FIRST, unconditionally — this
  // function can now be reached two ways (the explicit Cancel button, or
  // _closeModalDOM()'s dispatch on ✕/tap-outside/back), and either way the
  // handler must not linger and fire again on some later, unrelated modal.
  A._modalCancelHandler = null;
  const snap = A._typeSwitchSnapshot;
  delete A._typeSwitchSnapshot;
  _closeModalDOM();
  A._evDraftType = oldType;
  if (snap) {
    A._evDraftRestore = snap;
    A._suppressDraftRestoreToast = true;
  }
  openEvForm(oldType, evId||null, dateTs);
}
window.cancelTypeSwitch = cancelTypeSwitch;

// Confirm: build a converted "pseudo-source" object holding the common
// fields (per spec §3.1–§3.4), mapped from the snapshot captured in
// confirmTypeSwitch() (NOT live DOM — see the fix note there), then reload
// the form as the new type using that as its prefill source.
function switchEventType(newType, oldType, evId, dateTs){
  // Pass D fix: clear the cancel handler — Confirm is closing this modal
  // for real, not cancelling, so nothing should fire on the next
  // unrelated modal's close.
  A._modalCancelHandler = null;
  if(!newType || newType===oldType){ _closeModalDOM(); return; }
  const existingEv = evId ? A.events.find(e=>e.id===evId) : null;
  const isFullSeriesEdit = !!A._editSeriesMode;
  const isSingleOccurrenceOfSeries = !!(existingEv && existingEv.series_id && !isFullSeriesEdit);

  const snap = A._typeSwitchSnapshot || { fields:{}, participants:[], tags:[], actions:[], links:[] };
  const f = snap.fields || {};

  const src = {};

  // Title (§3.1 — always mapped)
  src.title = f['ef-title'] || '';

  // Date / time / all-day (§3.3)
  // Health Treatment/Illness render no ef-allday checkbox at all — those
  // sub-types are always date-only/all-day, so absence of the checkbox
  // means "was all-day" for mapping purposes.
  src.all_day = ('ef-allday' in f) ? !!f['ef-allday'] : true;
  const dateV = f['ef-date'] || '';
  const stimeV = f['ef-stime'] || '12:00';
  src.date = dateV ? localDT(dateV, src.all_day ? '12:00' : stimeV) : new Date().toISOString();

  // End date (§3.3) — only meaningful if the TARGET type uses one (Social /
  // Health-Appointment). Dropped entirely for Task, which has none.
  if (newType === 'task') {
    src.end_date = null;
  } else {
    const endDateV = f['ef-enddate'] || dateV;
    if (src.all_day) {
      src.end_date = endDateV ? localDT(endDateV, '12:00') : null;
    } else {
      let endTimeV = f['ef-etime'] || '';
      if (!endTimeV) {
        // Source had no end time of its own (e.g. Task -> Social) — default
        // to start time + 1 hour, per spec.
        const [h,m] = stimeV.split(':').map(Number);
        endTimeV = `${String(Math.min(h+1,23)).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      }
      src.end_date = endDateV ? localDT(endDateV, endTimeV) : null;
    }
  }

  // Location, Description, Tags, Actions, Attachments (§3.1 — always mapped)
  src.location = f['ef-loc'] || null;
  src.description = f['ef-desc'] || null;
  src.tags = snap.tags || [];
  src.actions = snap.actions || [];
  src.links = snap.links || [];

  // Assignee conversion (§3.2) — v22 (Anyone/All unification): Task now
  // uses the exact same participants[]/participants_all_family model as
  // Social/Health, so participants carry straight across for EVERY type
  // combination with no lossy conversion needed anymore. The old
  // "only a single specific participant carries over, multi/family
  // dropped" special-case for switching TO Task is gone — switching a
  // multi-person or Anyone/All event to Task no longer silently loses who
  // was assigned.
  const _srcParts = snap.participants || [];
  src.participants_all_family = _srcParts.includes('__family__');
  src.participants = _srcParts.filter(p=>p!=='__family__');
  src.member_id = null;

  // Recurrence (§3.5) — only carried over when editing the FULL series.
  // A single-occurrence type switch on a recurring event detaches that
  // occurrence entirely (handled at save time via A._detachSeriesOnSave,
  // matching the app's existing single-occurrence-edit behavior).
  if (isFullSeriesEdit) {
    src.recurrence = f['ef-rec'] || 'None';
    src.recurrence_end_type = f['ef-recend-type'] || 'count';
    src.recurrence_end_count = parseInt(f['ef-recend-n']) || null;
    src.recurrence_end_date = f['ef-recend-d'] || null;
  } else {
    src.recurrence = 'None';
    src.recurrence_end_type = null;
    src.recurrence_end_count = null;
    src.recurrence_end_date = null;
  }
  A._detachSeriesOnSave = isSingleOccurrenceOfSeries;

  A._pendingTypeSwitchSource = src;
  delete A._typeSwitchSnapshot;
  _closeModalDOM();
  openEvForm(newType, evId||null, dateTs);
}
window.switchEventType = switchEventType;

function syncEndDate(newStart) {
  const ed = document.getElementById('ef-enddate');
  const sd = document.getElementById('ef-date');
  if (!ed || !newStart) return;
  const oldStart = sd.dataset.prevDate || newStart;
  const oldEnd = ed.value;
  if (!oldEnd || oldEnd <= oldStart) {
    // Single-day or no end: end = new start
    ed.value = newStart;
  } else {
    // Multi-day: preserve duration
    const durMs = new Date(oldEnd) - new Date(oldStart);
    if (durMs > 86400000) {
      const newEnd = new Date(new Date(newStart).getTime() + durMs);
      ed.value = newEnd.toISOString().split('T')[0];
    } else {
      ed.value = newStart;
    }
  }
  sd.dataset.prevDate = newStart;
}
window.syncEndDate = syncEndDate;

function prefillWellness(memberId) {

    const el = document.getElementById(id);
    if (!el) return;
    el.value = '';
    el.style.background = '';
    el.style.borderColor = '';

  clearEl('ef-wt'); clearEl('ef-ht'); clearEl('ef-hyd'); clearEl('ef-en'); clearEl('ef-sl');
  const moodSel = document.getElementById('ef-mood');
  if (moodSel) { moodSel.value = ''; moodSel.style.background = ''; moodSel.style.borderColor = ''; }
  // Remove any existing prefill note so it is recreated fresh if new data is found
  document.getElementById('prefill-note')?.remove();
  const last = getLastWellness(memberId);
  if (!last) return;
  // Mark prefilled fields with a subtle tint so user knows these are from last log

// ── SAVE EVENT ────────────────────────────────────────────────────────────────
// ── SUPABASE WRITE WRAPPER ────────────────────────────────────────────────────
// Wraps any Supabase operation with timeout + one automatic retry
// Fixes silent failures caused by stale HTTP/2 connections
async function sbWrite(operation, opts = {}) {
  // v18 revert: back to 7000ms, per Roxana's testing feedback — the 25s
  // change (from the now-reverted Pass E) meant waiting a long time on every
  // slow save before even getting a retry, which felt worse in practice than
  // the faster-to-retry original. Worth investigating separately why saves
  // were slow enough to hit this at all — that's a more useful fix than the
  // timeout number itself.
  const TIMEOUT_MS = 7000;
  // v22.1: optional {silent:true} suppresses the "Connection issue —
  // retrying…" / "Save failed" toasts, for background operations (like the
  // 60s notification poll) that should never interrupt the user with a
  // toast for something they didn't initiate. Diagnostic console logging
  // (_logConnIssue) still fires either way.
  const silent = !!opts.silent;
  const withTimeout = (fn) => Promise.race([
    fn(),
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), TIMEOUT_MS))
  ]);
  try {
    return await withTimeout(operation);
  } catch (e) {
    const isConn = ['timeout','fetch','network','Failed to fetch'].some(k=>e.message?.includes(k));
    if (isConn) {
      // v22 diagnostics: log what we can about this event to the console so
      // we can start building a real picture of why/when this happens,
      // before deciding on an actual fix. Console-only — nothing leaves the
      // browser. See _logConnIssue() just below.
      _logConnIssue(operation, e, 'first-attempt-failed');
      if (!silent) toast('Connection issue — retrying…');
      await new Promise(r => setTimeout(r, 1000));
      // v22.1 REVERT: the earlier "no longer create a fresh client" change
      // was WRONG — confirmed by real staging testing where saves failed
      // completely (both the first attempt AND the retry timing out
      // back-to-back, repeatedly), something a genuinely fresh connection
      // fixes but retrying the same stuck connection does not. Reverted to
      // V21's original behavior: force a fresh Supabase client on retry to
      // break out of a stale HTTP/2 connection pool. The "Multiple
      // GoTrueClient instances" console warning this reintroduces is a
      // known, accepted cosmetic trade-off — a working save matters far
      // more. _logConnIssue() diagnostic logging stays active either way.
      try {
        sb = supabase.createClient(SB_URL, SB_KEY, {
          auth: { persistSession: true, autoRefreshToken: true },
          global: { fetch: (...a) => fetch(...a) }
        });
      } catch(_) {}
      try {
        const result = await withTimeout(operation);
        _logConnIssue(operation, null, 'retry-succeeded');
        return result;
      }
      catch (e2) {
        _logConnIssue(operation, e2, 'retry-failed');
        if (!silent) toast('Save failed. Please refresh and try again.', true);
        return { error: { message: e2.message }, data: null };
      }
    }
    throw e;
  }
}

// v22 diagnostics: lightweight logger for sbWrite() connection issues.
// Purely client-side (console only, nothing sent anywhere) — this exists so
// we can start spotting patterns (which operation, what kind of error,
// network/tab state, timing) instead of guessing at the cause of the
// "Connection issue — retrying…" toast. See project notes for background.
function _logConnIssue(operation, err, stage) {
  try {
    // Pull a short, readable snippet out of the operation's own source code
    // (e.g. "sb.from('events').insert(...)") so we know WHAT was being
    // saved without needing to touch every one of the 89 call sites that
    // use sbWrite() — Function.prototype.toString() gives us the original
    // source text of the passed-in arrow function for free.
    let opSnippet = 'unknown';
    try {
      const src = operation.toString();
      const match = src.match(/sb\.(from\('[^']+'\)[^;]*|rpc\('[^']+'\))/);
      opSnippet = match ? match[0].slice(0, 80) : src.slice(0, 80);
    } catch(_) {}

    console.warn('[sbWrite diagnostics]', {
      stage,                                      // 'first-attempt-failed' | 'retry-succeeded' | 'retry-failed'
      operation: opSnippet,                        // which table/action was being written
      errorMessage: err?.message || null,
      time: new Date().toISOString(),
      online: navigator.onLine,                     // browser's own network status
      visibility: document.visibilityState,          // was the tab/app in the foreground?
      connectionType: navigator.connection?.effectiveType || 'unknown', // e.g. '4g','wifi' (Chrome/Android only)
      connectionRtt: navigator.connection?.rtt ?? null, // estimated round-trip latency, ms
      userAgent: navigator.userAgent
    });
  } catch(_) { /* logging itself must never break the save flow */ }
}
window._logConnIssue = _logConnIssue;

// Build a local datetime ISO string that preserves user's intended time
function localDT(dateStr, timeStr) {
  if (!dateStr) return new Date().toISOString();
  const t = timeStr || '12:00';
  // Create date in local time, then get ISO with offset
  const [y,m,d] = dateStr.split('-').map(Number);
  const [h,mi] = t.split(':').map(Number);
  const local = new Date(y, m-1, d, h, mi, 0);
  // Format as ISO preserving local time
  const off = -local.getTimezoneOffset();
  const sign = off >= 0 ? '+' : '-';
  const pad = n => String(Math.abs(n)).padStart(2,'0');
  return `${dateStr}T${pad(h)}:${pad(mi)}:00${sign}${pad(Math.floor(Math.abs(off)/60))}:${pad(Math.abs(off)%60)}`;
}

    // updated_scope only means anything for recurring events being edited:
    // - editing the full series (editSeriesId set)     -> 'series'

    // - a brand-new event/series, or a plain non-recurring edit -> null
    //   (no scope to show until the first real edit decision is made)
    if (evId) {

    // v18 (Event Type Switcher §3.6): when an edit changes an event's type,

    // necessary because cleanData() further down only ever writes keys that
    // are actually present on `data` — and each type-branch above only ever
    // sets ITS OWN fields — so without this, something like `doctor` or

    if (evId) {

    // same as the app's existing single-occurrence-edit behavior for any

    if (A._detachSeriesOnSave) {

    // v14: generateRecurrences() must ONLY ever run when creating a brand-new
    // event. Previously it ran unconditionally on every save — including
    // edits — which always stamped a fresh series_id onto the edited row
    // (silently detaching it from its series) and, further down, re-seeded a
    // whole duplicate set of future occurrences from the edited date. That
    // was the root cause of the recurring-event edit corruption bug. Edits
    // (single-occurrence OR full-series) never touch series membership or
    // generate new rows — they only update the row(s) that already exist.
    const eventsToSave = evId ? [data] : generateRecurrences(data);

    // Strip any undefined/null keys that aren't in schema to avoid DB errors
    const cleanData = obj => {
      const allowed = ['family_id','type','title','date','end_date','all_day','location',
        'description','recurrence','recurrence_end_type','recurrence_end_count','recurrence_end_date',
        'appt_type','member_id','participants','participants_all_family','tags',
        'weight','height','hydration','exercised','activity','activity_mins','mood','energy','sleep',
        'social_type','actions','doctor','specialty','cost','cost_currency',
        'symptoms','cure','recommended_by','administration','considerations','links','series_id',
        'is_private','created_by_user_id', // v8: privacy fields
        'updated_at','updated_by_name','updated_scope']; // v18: last-edited timestamps
      const clean = {};
      allowed.forEach(k => { if (obj[k] !== undefined) clean[k] = obj[k]; });
      return clean;
    };
    const cleanedData = cleanData(data);
    const cleanedRecurrences = eventsToSave.map(cleanData);

    let savedFirst = null;
    if (evId) {
      const {family_id:_, ...updateData} = cleanedData;
      const res = await sbWrite(() => sb.from('events').update(updateData).eq('id', evId).select().single());
      if (res.error) {
        console.error('Update error', res.error);
        toast('Error saving: ' + (res.error.message||'unknown'), true);
        return;
      }
      A.events = A.events.map(e => e.id===evId ? res.data : e);
      savedFirst = res.data;

      // v14: "Edit full recurrence" — extended to apply EVERY edited field to
      // every sibling occurrence (not just a fixed subset), including
      // all_day, time-of-day, and a calendar-date shift. Date/end_date differ
      // per sibling (each keeps its own day unless the whole series is being
      // shifted), so this is a per-row update rather than one blanket UPDATE.
      if (editSeriesId) {
        const siblings = A.events.filter(e => e.series_id === editSeriesId && e.id !== evId);
        if (siblings.length) {
          // Everything except identity/date fields applies identically to
          // every occurrence. Date/end_date get their own per-occurrence
          // handling below (day-delta + time-of-day), so they're excluded here.
          const EXCLUDE_FROM_SHARED = new Set(['family_id','date','end_date','series_id','created_by_user_id','id']);
          const sharedUpdate = {};
          Object.keys(cleanedData).forEach(k => { if (!EXCLUDE_FROM_SHARED.has(k)) sharedUpdate[k] = cleanedData[k]; });

          // Calendar-day delta between the edited occurrence's ORIGINAL date
          // (captured at the top of this function, before the user's edits)
          // and its NEW date — applied to every sibling so the whole series
          // shifts together while preserving relative spacing. A pure
          // time-of-day change (no date change) produces a delta of 0, so
          // siblings keep their own day and only pick up the new time.
          const origDateOnly = _origEvForDelta ? new Date(_origEvForDelta.date) : new Date(cleanedData.date);
          origDateOnly.setHours(0,0,0,0);
          const newDateOnly = new Date(cleanedData.date);
          newDateOnly.setHours(0,0,0,0);
          const dayDeltaMs = newDateOnly - origDateOnly;
          const newDateObj = new Date(cleanedData.date);
          const newEndDateObj = cleanedData.end_date ? new Date(cleanedData.end_date) : null;

          const siblingUpdates = siblings.map(sib => {
            const shiftedDate = new Date(new Date(sib.date).getTime() + dayDeltaMs);
            if (cleanedData.all_day) shiftedDate.setHours(12,0,0,0);
            else shiftedDate.setHours(newDateObj.getHours(), newDateObj.getMinutes(), 0, 0);
            let shiftedEndDateIso = null;
            if (sib.end_date) {
              const shiftedEnd = new Date(new Date(sib.end_date).getTime() + dayDeltaMs);
              if (cleanedData.all_day) shiftedEnd.setHours(12,0,0,0);
              else if (newEndDateObj) shiftedEnd.setHours(newEndDateObj.getHours(), newEndDateObj.getMinutes(), 0, 0);
              shiftedEndDateIso = shiftedEnd.toISOString();
            }
            return { id: sib.id, payload: { ...sharedUpdate, date: shiftedDate.toISOString(), end_date: shiftedEndDateIso } };
          });

          // v10 (UX hardening) carried forward: sbWrite() + explicit error
          // handling on every sibling write — the primary event above already
          // saved successfully, so a failure here warns rather than blocks.
          const results = await Promise.all(siblingUpdates.map(u =>
            sbWrite(() => sb.from('events').update(u.payload).eq('id', u.id).select().single())
          ));
          const failed = results.filter(r => r.error);
          if (failed.length) {
            toast(`Entry saved, but ${failed.length} of ${siblings.length} other occurrence${siblings.length!==1?'s':''} failed to update — please try again.`, true);
            console.error('Series sibling update errors', failed.map(f => f.error));
          }
          const succeeded = results.filter(r => !r.error && r.data);
          if (succeeded.length) {
            const byId = {};
            succeeded.forEach(r => { byId[r.data.id] = r.data; });
            A.events = A.events.map(e => byId[e.id] ? byId[e.id] : e);
            A._seriesUpdateMsg = `Series updated! ✅ (${succeeded.length + 1} occurrence${succeeded.length+1!==1?'s':''})`;
          }
        }

        // ── v22: RECURRENCE COUNT FIX ──────────────────────────────────
        // Editing the full series can change how many occurrences the
        // series SHOULD have (a new count, a new end date, or a new end
        // type) — but nothing above this point ever added or removed
        // actual event rows to match; it only ever updated rows that
        // already existed. This compares the just-saved recurrence
        // settings against what's actually in the database and grows or
        // shrinks the series to match, reusing the same date-stepping
        // rules generateRecurrences() uses for brand-new series, so a
        // grown series looks identical to one created that size from the
        // start. Reads A.events fresh (after the sibling date-shift
        // update above), so it always compares against the real,
        // just-saved state. Only runs when recurrence is still active —
        // a single-occurrence edit never reaches this branch at all, and
        // clearing recurrence entirely on a full-series edit is left
        // alone (out of scope for this fix).
        if (data.recurrence && data.recurrence !== 'None') {
          const currentSeriesEvents = A.events
            .filter(e => e.series_id === editSeriesId)
            .sort((a,b) => new Date(a.date) - new Date(b.date));
          const currentCount = currentSeriesEvents.length;

          const stepDate = d => {
            const next = new Date(d);
            if (data.recurrence === 'Monthly') next.setMonth(next.getMonth() + 1);
            else if (data.recurrence === 'Yearly') next.setFullYear(next.getFullYear() + 1);
            else if (data.recurrence === 'Daily') next.setDate(next.getDate() + 1);
            else if (data.recurrence === 'Weekly') next.setDate(next.getDate() + 7);
            else if (data.recurrence === 'Bi-weekly') next.setDate(next.getDate() + 14);
            return next;
          };

          // Resolve how many occurrences the series SHOULD have, per the
          // just-saved recurrence settings — mirrors generateRecurrences()'s
          // own totalCount/endDateLimit resolution.
          const endType = data.recurrence_end_type || 'none';
          let targetCount = currentCount; // default: no change if unresolved
          if (endType === 'count') {
            targetCount = Math.max(1, data.recurrence_end_count || 1);
          } else if (endType === 'date' && data.recurrence_end_date) {
            const endDateLimit = new Date(data.recurrence_end_date + 'T23:59:59');
            let count = 1;
            let cursor = new Date(currentSeriesEvents[0]?.date || cleanedData.date);
            while (count <= 200) {
              const next = stepDate(cursor);
              if (next > endDateLimit) break;
              cursor = next;
              count++;
            }
            targetCount = count;
          } else if (endType === 'none') {
            // "Repeat forever" — same practical cap generateRecurrences()
            // uses for brand-new series. Only ever GROWS toward this cap
            // if the series is currently smaller — never shrinks an
            // existing longer series just because it's now "forever".
            targetCount = Math.max(currentCount, 365);
          }

          if (targetCount > currentCount) {
            // ── GROW: generate the missing occurrence(s), continuing from
            // the LAST existing occurrence's date. Every new row gets the
            // same shared fields just saved on this edit (same exclusion
            // set already used for siblings above: everything except
            // identity/date fields).
            const EXCLUDE_FROM_NEW = new Set(['family_id','date','end_date','series_id','created_by_user_id','id']);
            const templateFields = {};
            Object.keys(cleanedData).forEach(k => { if (!EXCLUDE_FROM_NEW.has(k)) templateFields[k] = cleanedData[k]; });
            const lastEv = currentSeriesEvents[currentSeriesEvents.length - 1];
            const lastDate = new Date(lastEv.date);
            const lastEndDate = lastEv.end_date ? new Date(lastEv.end_date) : null;
            const duration = lastEndDate ? (lastEndDate - lastDate) : 0;
            const newRows = [];
            let cursor = lastDate;
            for (let i = 0; i < targetCount - currentCount; i++) {
              cursor = stepDate(cursor);
              newRows.push({
                family_id: A.family.id,
                created_by_user_id: lastEv.created_by_user_id || null,
                series_id: editSeriesId,
                date: cursor.toISOString(),
                end_date: duration ? new Date(cursor.getTime() + duration).toISOString() : null,
                ...templateFields,
              });
            }
            if (newRows.length) {
              const insRes = await sbWrite(() => sb.from('events').insert(newRows).select());
              if (insRes.error) {
                toast('Series updated, but adding the new occurrence(s) failed — please try again.', true);
                console.error('Series growth insert error', insRes.error);
              } else if (insRes.data) {
                A.events.push(...insRes.data);
                A._seriesUpdateMsg = `Series updated! ✅ (${targetCount} occurrence${targetCount!==1?'s':''})`;
              }
            }
          } else if (targetCount < currentCount) {
            // ── SHRINK (v22.1, corrected per testing feedback): keep the
            // EARLIEST `targetCount` occurrences, delete the rest. An
            // earlier version of this logic tried to protect the actively-
            // edited occurrence (evId) from ever being deleted — this
            // produced a confusing, non-contiguous kept set whenever the
            // edited occurrence wasn't among the ones a straightforward
            // date-based trim would keep (e.g. editing the LAST occurrence
            // of a 5x series and shrinking to 3x kept an arbitrary
            // Mon/Tue/Fri mix instead of a clean "first 3" trim). That
            // protection turns out to be unnecessary: the edited field
            // VALUES already propagated to every surviving sibling via the
            // sharedUpdate sync above, so which literal database row
            // survives doesn't matter to the user — only "does the series
            // end up with the right occurrences, correct dates, correct
            // values" does. currentSeriesEvents is already sorted ascending
            // by date (see its definition above), so this is now a
            // straightforward slice.
            const toDelete = currentSeriesEvents.slice(targetCount);
            if (toDelete.length) {
              const delIds = toDelete.map(e => e.id);
              const delRes = await sbWrite(() => sb.from('events').delete().in('id', delIds));
              if (delRes.error) {
                toast('Series updated, but removing extra occurrence(s) failed — please try again.', true);
                console.error('Series shrink delete error', delRes.error);
              } else {
                A.events = A.events.filter(e => !delIds.includes(e.id));
                A._seriesUpdateMsg = `Series updated! ✅ (${targetCount} occurrence${targetCount!==1?'s':''})`;
              }
            }
          }
        }
      }
    } else {
      const res = await sbWrite(() => sb.from('events').insert(cleanedRecurrences).select());
      if (res.error) {
        console.error('Insert error', res.error);
        toast('Error: ' + (res.error.message||'unknown error'), true);
        return;
      }
      if (!res.data || res.data.length === 0) {
        console.error('Insert blocked silently — RLS or missing columns. Payload:', cleanedRecurrences[0]);
        toast('Save failed — please check you are signed in and try again.', true);
        return;
      }
      A.events.push(...res.data); savedFirst = res.data[0];
    }

    // Sync any new tags to family.tags so they appear in Settings
    if (data.tags?.length && A.family) {
      const existingTags = A.family.tags || [];
      const newTags = data.tags.filter(t => !existingTags.includes(t));
      if (newTags.length) {
        const merged = [...new Set([...existingTags, ...newTags])];
        sb.from('families').update({tags:merged}).eq('id',A.family.id).select().single()
          .then(({data:fd})=>{ if(fd) A.family=fd; });
      }
    }
    _saveOk = true;
    clearEvDraft(); // v13: event saved successfully — discard the localStorage draft
    _closeModalDOM();
    // v8: write activity notification so other family members are informed.
    // v14: private events must never generate a visible notification to other
    // family members — the notification trigger previously ignored is_private
    // entirely, even though Home/Calendar already hid private events from
    // everyone but the creator. The creator's own toast confirmation below is
    // unaffected either way — this only gates the cross-family notification.
    if (!data.is_private) {
      const _notifTitle = data.title || ET[type]?.label || '';
      writeNotif('event', evId ? 'updated' : 'created',
        evId ? `${getActorName()} updated an event` : `${getActorName()} added a new event`,
        _notifTitle
      );
    }
    const _seriesMsg = A._seriesUpdateMsg; delete A._seriesUpdateMsg;
    toast(_seriesMsg || (evId ? 'Entry updated! ✅' : `Entry added!${eventsToSave.length>1?' ('+eventsToSave.length+' occurrences created)':''}`));
    renderCal();
    renderHome();
  } catch(e) {
    console.error('saveEv error', e);
    toast('Something went wrong — please try again.', true);
  } finally {
    hideSavingToast();
    if (!_saveOk && _saveBtn) {
      _saveBtn.disabled = false;
      _saveBtn.textContent = _saveBtn.dataset.origText || (evId ? 'Save Changes' : 'Add Entry');
      _saveBtn.style.opacity = '';
    }
  }
}
window.saveEv = saveEv;

// ── GENERATE RECURRENCES ──────────────────────────────────────────────────────
function generateRecurrences(data) {
  const events = [data]; // first event is always included
  const rec = data.recurrence;
  if (!rec || rec === 'None') return events;

  // Stamp all occurrences with a shared series_id so they can be managed together
  const seriesId = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
  events[0].series_id = seriesId;

  const endType = data.recurrence_end_type || 'none';
  // For 'count': total occurrences INCLUDING the first = recurrence_end_count
  // For 'date': repeat until that date
  // For 'none': repeat for 1 year (52 weekly max)
  const totalCount = endType === 'count' ? Math.max(1, data.recurrence_end_count || 1) : 365;
  const endDateLimit = endType === 'date' && data.recurrence_end_date
    ? new Date(data.recurrence_end_date + 'T23:59:59')
    : endType === 'none'
    ? new Date('2099-12-31') // repeat forever — capped at 2099 for DB safety
    : null;

  const baseDate = new Date(data.date);
  const baseEnd = data.end_date ? new Date(data.end_date) : null;
  const duration = baseEnd ? (baseEnd - baseDate) : 0;

  let generated = 0; // count of additional events (not counting base)
  let current = new Date(baseDate);

  while (generated < totalCount - 1) { // -1 because base event counts as 1
    let next = new Date(current);
    if (rec === 'Monthly') next.setMonth(next.getMonth() + 1);
    else if (rec === 'Yearly') next.setFullYear(next.getFullYear() + 1);
    else if (rec === 'Daily') next.setDate(next.getDate() + 1);
    else if (rec === 'Weekly') next.setDate(next.getDate() + 7);
    else if (rec === 'Bi-weekly') next.setDate(next.getDate() + 14);
    else break; // unknown recurrence

    if (endDateLimit && next > endDateLimit) break;
    if (generated > 200) break; // hard safety cap

    const recEvent = {...data};
    recEvent.date = next.toISOString();
    if (baseEnd) recEvent.end_date = new Date(next.getTime() + duration).toISOString();
    recEvent.series_id = seriesId; // link all occurrences to the same series
    delete recEvent.id; // ensure new ID on insert
    events.push(recEvent);
    current = next;
    generated++;
  }
  return events;
}

// ── DRAFT-CHECK SEQUENCING (v17) ────────────────────────────────────────────
// Runs the event/note/meal draft-restore checks one at a time instead of all
// at once, so at most one restore banner is ever visible on screen. Each
// checkAndOffer*Draft() function returns the DOM id of the banner it just
// displayed (or nothing, if there was no draft worth offering). We poll for
// that banner's removal — Discard/Restore tap, or its own 15s auto-dismiss —
// before moving on to the next check in the queue.
function _runDraftChecksSequentially(queue){
  if(!queue.length) return;
  const [check,...rest]=queue;
  const bannerId=check();
  if(!bannerId){ _runDraftChecksSequentially(rest); return; }
  const poll=setInterval(()=>{
    if(!document.getElementById(bannerId)){
      clearInterval(poll);
      _runDraftChecksSequentially(rest);
    }
  },300);
}

// ── EVENT FORM DRAFT (v13) ────────────────────────────────────────────────────
// Protects against iOS Safari silently reloading tabs and destroying unsaved event
// form data. A draft is written to localStorage every 5 seconds while any event
// form is open. On the next page load, a banner offers to restore the in-progress entry.
// Draft is cleared automatically when the event is successfully saved.

const _evDraftKey=()=>'ks_ev_draft_'+(A.user?.id||'anon');
const _evDraftMaxAge=2*60*60*1000; // discard drafts older than 2 hours

function saveEvDraft(){
  if(!A.user||!A.family) return;
  // v17 fix: don't bother saving a draft that's essentially blank — no title
  // means there's nothing meaningful worth protecting, so nothing gets
  // written, and therefore nothing will ever get offered for restore later.
  const _titleEl=document.getElementById('ef-title');
  if(!_titleEl||!_titleEl.value||!_titleEl.value.trim()) return;
  // Collect all possible form field values that exist in the DOM right now.
  // ef-stime/ef-etime are excluded here — v13's custom time picker made them
  // hour/minute select pairs rather than single inputs, so they're captured
  // separately below via getTimeVal().
  const fieldIds=[
    'ef-title','ef-date','ef-enddate','ef-allday',
    'ef-loc','ef-social-type','ef-desc','ef-mem','ef-rec',
    'ef-recend-type','ef-recend-n','ef-recend-d',
    'ef-wt','ef-ht','ef-hyd','ef-ex','ef-act','ef-actm','ef-mood','ef-en','ef-sl','ef-wcomment',
    'ef-apt','ef-doctor','ef-specialty','ef-cost','ef-cost-cur',
    'ef-symptoms','ef-cure','ef-recby','ef-considerations','ef-private'
  ];
  const fields={};
  fieldIds.forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    fields[id]=el.type==='checkbox'?el.checked:el.value;
  });
  // v13: capture the two time-picker fields via getTimeVal() instead of .value
  const stimeVal=getTimeVal('ef-stime');
  if(stimeVal) fields['ef-stime']=stimeVal;
  const etimeVal=getTimeVal('ef-etime');
  if(etimeVal) fields['ef-etime']=etimeVal;
  const participants=Array.from(document.querySelectorAll('#ef-parts button[data-sel="true"]')).map(b=>b.dataset.mid).filter(Boolean);
  const tags=Array.from(document.querySelectorAll('#ef-tags button[data-sel="true"]')).map(b=>b.dataset.tag).filter(Boolean);
  const draft={
    type:A._evDraftType||'social',
    apptType:document.getElementById('ef-apt')?.value||null,
    timestamp:Date.now(),
    // v18 (Draft Safety Fix C1): which real event this draft belongs to, if
    // any. null means it's a brand-new (unsaved) event.
    editingEventId:A._evDraftEditingId||null,
    fields,participants,tags,
  };
  try{localStorage.setItem(_evDraftKey(),JSON.stringify(draft));}catch(_){}
}
window.saveEvDraft=saveEvDraft;

function clearEvDraft(){
  try{localStorage.removeItem(_evDraftKey());}catch(_){}
  A._evDraftType=null;
}
window.clearEvDraft=clearEvDraft;

function checkAndOfferEvDraft(){
  if(!A.user||!A.family) return;
  let draft;
  try{
    const raw=localStorage.getItem(_evDraftKey());
    if(!raw) return;
    draft=JSON.parse(raw);
  }catch(_){return;}
  // Discard stale drafts
  if(!draft||!draft.timestamp||Date.now()-draft.timestamp>_evDraftMaxAge){
    clearEvDraft();return;
  }
  // v17 defensive backstop: silently discard a near-blank draft instead of
  // offering it — covers any old blank draft already sitting in localStorage
  // from before saveEvDraft()'s title check above existed.
  if(!draft.fields?.['ef-title']||!draft.fields['ef-title'].trim()){
    clearEvDraft();return;
  }
  // Show a non-intrusive restoration banner at the bottom of the screen
  const existing=document.getElementById('ev-draft-banner');
  if(existing) existing.remove();
  const banner=document.createElement('div');
  banner.id='ev-draft-banner';
  banner.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:#1e1b16;color:#fff;border-radius:12px;padding:12px 14px;z-index:500;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:fadeUp .3s ease';
  const evType=ET[draft.type]?.label||'entry';
  const evTitle=draft.fields?.['ef-title'];
  const draftDate=new Date(draft.timestamp);
  const tStr=draftDate.getHours().toString().padStart(2,'0')+':'+draftDate.getMinutes().toString().padStart(2,'0');
  banner.innerHTML=`
    <div style="min-width:0">
      <div style="font-weight:700;font-size:13px">📝 Unfinished ${evType}</div>
      <div style="font-size:11px;opacity:.75;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${evTitle?'"'+evTitle+'"':'No title yet'} · Draft from ${tStr}</div>
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button onclick="document.getElementById('ev-draft-banner')?.remove();clearEvDraft()" style="background:rgba(255,255,255,.15);border:none;border-radius:8px;color:#fff;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent">Discard</button>
      <button onclick="document.getElementById('ev-draft-banner')?.remove();restoreEvDraft()" style="background:#5e8b62;border:none;border-radius:8px;color:#fff;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent">Restore ✓</button>
    </div>`;
  document.body.appendChild(banner);
  setTimeout(()=>document.getElementById('ev-draft-banner')?.remove(),15000); // auto-dismiss
  return 'ev-draft-banner'; // v17: tells the sequencing orchestrator a banner is now showing
}
window.checkAndOfferEvDraft=checkAndOfferEvDraft;

function restoreEvDraft(){
  let draft;
  try{
    const raw=localStorage.getItem(_evDraftKey());
    if(!raw) return;
    draft=JSON.parse(raw);
  }catch(_){return;}
  if(!draft) return;
  // v18 (Draft Safety Fix C1): reopen the SAME existing event this draft was
  // edited from, instead of always opening a blank new-event form (which
  // previously caused Save to create a duplicate rather than update the
  // original). Defensive fallback: if the event no longer exists (e.g. it
  // was deleted by another family member while this draft sat unsaved),
  // fall back to treating it as a new entry rather than trying to update a
  // row that isn't there.
  const targetEvId = (draft.editingEventId && A.events.some(e=>e.id===draft.editingEventId))
    ? draft.editingEventId
    : null;
  // Queue the draft data, then open the form — restoration happens inside openEvForm's setTimeout
  A._evDraftType=draft.type;
  A._evDraftRestore=draft;
  openEvForm(draft.type,targetEvId,null);
}
window.restoreEvDraft=restoreEvDraft;

// ── DELETE ENTIRE SERIES ──────────────────────────────────────────────────────
// Deletes all events with the given series_id from the DB and local state.
async function deleteEntireSeries(seriesId) {
  const toDelete = A.events.filter(e=>e.series_id===seriesId);
  if (!toDelete.length) { closeModal(); return; }
  // v10 (UX hardening): button-disable + saving toast + sbWrite() for idle-safety.
  // The series delete modal has exactly one danger button ("Delete all X
  // occurrences"), so this selector is reliable.
  const _delBtn=document.querySelector('.modal-body button.btn-danger');
  if(_delBtn){_delBtn.disabled=true;_delBtn.dataset.origText=_delBtn.textContent;_delBtn.textContent='Deleting…';_delBtn.style.opacity='0.7';}
  showSavingToast();
  let _delOk=false;
  try{
    const {error} = await sbWrite(() => sb.from('events').delete().eq('series_id', seriesId));
    if (error) { toast('Error deleting series.', true); console.error(error); return; }
    A.events = A.events.filter(e=>e.series_id!==seriesId);
    _delOk=true;
    closeModal();
    toast(`Series deleted — ${toDelete.length} occurrence${toDelete.length!==1?'s':''} removed.`);
    renderCal();
    renderHome();
  }catch(e){
    toast('Something went wrong — please try again.', true); console.error(e);
  }finally{
    hideSavingToast();
    if(!_delOk&&_delBtn){_delBtn.disabled=false;_delBtn.textContent=_delBtn.dataset.origText||'Delete';_delBtn.style.opacity='';}
  }
}
window.deleteEntireSeries = deleteEntireSeries;
