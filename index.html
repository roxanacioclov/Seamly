// ── INSIGHTS ──────────────────────────────────────────────────────────────────
// ── INSIGHTS PAGE ────────────────────────────────────────────────────────────
// v21: full rework. Previously this page showed Wellness observations plus
// trend charts (weight/sleep/energy/hydration); the Wellness section is now
// dropped entirely and no charts appear anywhere on this page. Instead it
// surfaces one simple line/list/number per item, pulled from the app's five
// other modules — Calendar, Notebook, Inventory, Shopping, Meals. The
// Weekly Family Challenge banner is unchanged, just moved to the top
// instead of sitting above the old Wellness section.
// See seamly_v17_insights_spec.md (content confirmed, assigned to V21) for
// the full spec this implements.

// Adjustable config for the Inventory > "Products expiring soon" section —
// kept as a named constant instead of a hardcoded 30 inline, per spec §2.3.
const INSIGHTS_EXPIRY_WINDOW_DAYS = 30;

// ── Calendar helpers ─────────────────────────────────────────────────────────

// Busiest day of the week, by AVERAGE event count per weekday, over the
// last 30 days (today and the 29 days before it). A straight count would
// be biased by the fact that a 30-day window doesn't contain the exact
// same number of each weekday — dividing by how many times each weekday
// actually occurred in the window corrects for that.
// Wellness log entries (type:'wellness') are excluded, consistent with how
// the rest of the app (e.g. Home's Today/Coming Up sections) already
// treats them as daily logs rather than calendar events.
function _insightsBusiestDay(){
  const end=todayD(); end.setHours(23,59,59,999);
  const start=addDays(todayD(),-29); start.setHours(0,0,0,0);
  const counts=[0,0,0,0,0,0,0], occurrences=[0,0,0,0,0,0,0];
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) occurrences[d.getDay()]++;
  getEvents().forEach(e=>{
    if(e.type==='wellness') return;
    const d=new Date(e.date);
    if(d<start||d>end) return;
    counts[d.getDay()]++;
  });
  let bestIdx=-1, bestAvg=0;
  for(let i=0;i<7;i++){
    if(!occurrences[i]) continue;
    const avgV=counts[i]/occurrences[i];
    if(avgV>bestAvg){bestAvg=avgV;bestIdx=i;}
  }
  if(bestIdx===-1) return null;
  const names=['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
  return names[bestIdx];
}

// Busiest family member over the same 30-day window. Tasks are tallied by
// member_id; Social/Health events are tallied by participants[]. Events
// flagged participants_all_family:true are excluded from every member's
// count entirely — confirmed rule from the spec.
function _insightsBusiestMember(){
  const end=todayD(); end.setHours(23,59,59,999);
  const start=addDays(todayD(),-29); start.setHours(0,0,0,0);
  const tally={};
  getEvents().forEach(e=>{
    if(e.type==='wellness') return;
    if(e.participants_all_family) return;
    const d=new Date(e.date);
    if(d<start||d>end) return;
    const ids = e.member_id ? [e.member_id] : (e.participants||[]);
    ids.forEach(id=>{ tally[id]=(tally[id]||0)+1; });
  });
  let bestId=null, bestCt=0;
  Object.entries(tally).forEach(([id,ct])=>{ if(ct>bestCt){bestCt=ct;bestId=id;} });
  if(!bestId) return null;
  const m=getMem(bestId);
  return m ? {name:m.name, count:bestCt} : null;
}

// Most recent Health-type event per family member (no 30-day window — this
// one looks back as far as needed). A whole-family Health event
// (participants_all_family:true) counts as the "last health event" for
// every member.
function _insightsLastHealthPerMember(){
  const hEvs=getEvents().filter(e=>e.type==='health').sort((a,b)=>new Date(b.date)-new Date(a.date));
  return getMembers().map(m=>{
    const ev=hEvs.find(e=>{
      if(e.participants_all_family) return true;
      const ids = e.member_id ? [e.member_id] : (e.participants||[]);
      return ids.includes(m.id);
    });
    return {member:m, event:ev||null};
  });
}

// Shared with Home's "Other Actions" section (renderHome()) — same
// two-part definition (incomplete Tasks + non-Task events with an open
// action item), same overdue/7-days-ahead window. Pulled out into one
// function so the two can never quietly drift apart, per the spec's own
// risk note. excludeIds lets Home hide items its own Today/Coming Up
// sections already show above Other Actions; Insights has no such
// sections, so it calls this with no exclusion at all.
function _followUpCalendarItems(excludeIds){
  const today=todayD();
  const weekAhead=addDays(today,7); weekAhead.setHours(23,59,59,999);
  const ex=excludeIds||new Set();
  return [
    ...getEvents().filter(e=>e.type==='task'&&!e.completed_at&&new Date(e.date)<=weekAhead&&!ex.has(e.id)),
    ...getEvents().filter(e=>e.type!=='task'&&e.actions?.length>0&&e.actions.some(a=>!a.done)&&new Date(e.date)<=weekAhead&&!ex.has(e.id)),
  ].sort((a,b)=>new Date(a.date)-new Date(b.date));
}

// ── Notebook helper ──────────────────────────────────────────────────────────
function _insightsOpenChecklistNotes(){
  return getNotes().filter(n=>n.checklist?.length>0&&n.checklist.some(c=>!c.done)).length;
}

// ── Inventory (Medications) helpers ──────────────────────────────────────────
function _insightsMedsPerMember(){
  return getMembers().map(m=>({
    member:m,
    count:getDM().filter(med=>(med.member_ids||[]).includes(m.id)).length
  }));
}
// Reuses effMedDaysLeft() — the same formula already driving the Meds
// table's stock badges and the low-stock notification alert — so this can
// never disagree with what's shown elsewhere in Inventory.
function _insightsMedRunsOutFirst(){
  return getMembers().map(m=>{
    const meds=getDM().filter(med=>(med.member_ids||[]).includes(m.id));
    let worst=null, worstDays=Infinity;
    meds.forEach(med=>{
      const d=effMedDaysLeft(med);
      if(d!==null && d<worstDays){worstDays=d;worst=med;}
    });
    return {member:m, med:worst, daysLeft:worst?worstDays:null};
  });
}
function _insightsExpiringProducts(){
  const now=new Date();
  const cutoff=addDays(now, INSIGHTS_EXPIRY_WINDOW_DAYS); cutoff.setHours(23,59,59,999);
  return (A.invProducts||[])
    .filter(p=>p.expiry && new Date(p.expiry)>=now && new Date(p.expiry)<=cutoff)
    .sort((a,b)=>new Date(a.expiry)-new Date(b.expiry));
}

// ── Shopping helper ──────────────────────────────────────────────────────────
function _insightsUncheckedShoppingCount(){
  let n=0;
  (A.shoppingLists||[]).forEach(l=>(l.items||[]).forEach(item=>{ if(!item.done) n++; }));
  return n;
}

// ── Meals helper ─────────────────────────────────────────────────────────────
function _insightsMealPlanCompletion(){
  const data=A.mealPlan?.plan_data||{};
  let filled=0; const total=MEAL_PLAN_ROWS.length*MEAL_PLAN_DAYS.length;
  MEAL_PLAN_ROWS.forEach(row=>MEAL_PLAN_DAYS.forEach(day=>{ if((data[row]?.[day]||'').trim()) filled++; }));
  return total ? Math.round((filled/total)*100) : 0;
}

// v22 (Insights Clickability): list-reveal modal for "Events to follow up
// on" — the one Insights card that's a mix of tasks and non-task events
// with open actions, so no single existing page shows exactly this set.
// Reuses the exact same _followUpCalendarItems() data already powering
// both this card and Home's "Other Actions" section, so the count shown
// on the card can never disagree with what's shown in this list. Each row
// closes the sheet and opens the real event/task via the existing,
// unmodified viewEv().
function _showFollowUpListModal(){
  const items = _followUpCalendarItems();
  const today = todayD();
  const rows = items.map(e=>{
    const isTask = e.type === 'task';
    const isOverdue = new Date(e.date) < today;
    const openCount = (e.actions||[]).filter(a=>!a.done).length;
    const icon = isTask ? '✅' : ET[e.type].icon;
    const subtitle = isTask
      ? `${isOverdue?'⚠️ Overdue · ':''}Due: ${fmt(e.date)} · ${openCount} open item${openCount!==1?'s':''}`
      : `${fmt(e.date)} · ${openCount} open item${openCount!==1?'s':''}`;
    return `<div onclick="closeModal();setTimeout(()=>viewEv('${e.id}'),50)" style="display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;background:#fff;border-left:3px solid ${T.sky};margin-bottom:6px;cursor:pointer">
      <span style="font-size:16px">${icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.series_id?'🔁 ':''}${e.title||(isTask?'Untitled Task':ET[e.type].label)}</div>
        <div style="font-size:11px;color:${isTask&&isOverdue?T.rose:T.muted}">${subtitle}</div>
      </div>
    </div>`;
  }).join('');
  showModal('Events to follow up on', items.length ? rows : `<div style="text-align:center;color:${T.muted};padding:20px 0;font-size:13px">Nothing to follow up on right now 🎉</div>`);
}
window._showFollowUpListModal = _showFollowUpListModal;

function renderInsights(){
  // Weekly Family Challenge — unchanged selection logic, just repositioned
  // above the module sections below instead of above the old Wellness
  // section.
  const weekNum=Math.floor((new Date()-new Date(new Date().getFullYear(),0,1))/(7*24*60*60*1000));
  const challenge=CHALLENGES[weekNum%CHALLENGES.length];

  // Calendar
  const busiestDay=_insightsBusiestDay();
  const busiestMember=_insightsBusiestMember();
  const lastHealthPerMember=_insightsLastHealthPerMember();
  const followUpCount=_followUpCalendarItems().length;

  // Notebook
  const openChecklistCount=_insightsOpenChecklistNotes();

  // Inventory
  const medsPerMember=_insightsMedsPerMember();
  const medRunsOutFirst=_insightsMedRunsOutFirst();
  const expiringProducts=_insightsExpiringProducts();

  // Shopping
  const uncheckedShoppingCount=_insightsUncheckedShoppingCount();

  // Meals
  const mealCompletion=_insightsMealPlanCompletion();

  const sectionTitle=(icon,label)=>`<div style="font-family:'Playfair Display',serif;font-size:16px;color:${T.ink};margin:18px 0 10px;display:flex;align-items:center;gap:7px">${icon} ${label}</div>`;
  // v22 (Insights Clickability): lineCard/memberRow both take an optional
  // onclick string. When provided, the whole card/row becomes tappable —
  // cursor:pointer, a trailing "›" affordance matching the style already
  // used on event/note cards elsewhere in the app (e.g. Home's sky-left-
  // border cards) — and the onclick fires. When omitted (the default),
  // both render exactly as they did before this pass: plain, non-interactive.
  const lineCard=(html,onclick=null)=>`<div class="card" style="padding:12px 14px;margin-bottom:8px;font-size:13px;color:${T.ink};line-height:1.5;${onclick?'cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px':''}"${onclick?` onclick="${onclick}"`:''}><div style="flex:1;min-width:0">${html}</div>${onclick?`<span style="color:${T.muted};font-size:16px;flex-shrink:0">›</span>`:''}</div>`;
  const emptyLine=text=>`<div style="font-size:12px;color:${T.muted};padding:2px 0">${text}</div>`;
  const memberRow=(name,valueHtml,onclick=null)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;${onclick?'cursor:pointer':''}"${onclick?` onclick="${onclick}"`:''}><span>${name}</span><span style="display:flex;align-items:center;gap:5px;color:${T.muted};text-align:right"><span>${valueHtml}</span>${onclick?`<span style="font-size:13px">›</span>`:''}</span></div>`;
  // Tier 3 (Busiest day / Busiest member): tap toggles a short inline
  // explanation open/closed directly under the card — no modal, no
  // navigation. A couple of lines flipping one wrapper div's display is

      ${lineCard(busiestMember?`<b>${busiestMember.name}</b> has the most on their plate this month (${busiestMember.count} event${busiestMember.count===1?'':'s'}).${infoToggle('insight-busiest-member-info','Based on how many events are assigned to each member over the last 30 days.')}`:emptyLine('No events assigned to a member in the last 30 days.'))}
      ${lineCard(`<div style="font-weight:700;margin-bottom:6px">Last health event per member</div>${lastHealthPerMember.length?lastHealthPerMember.map(({member,event})=>memberRow(member.name, event?`${event.title||'Health event'}, ${fmt(event.date)}`:'No health events logged', event?`viewEv('${event.id}')`:null)).join(''):emptyLine('No family members yet.')}`)}

      ${lineCard(`<div style="font-weight:700;margin-bottom:6px">Runs out first, per member</div>${medRunsOutFirst.length?medRunsOutFirst.map(({member,med,daysLeft})=>memberRow(member.name, med?`<span style="color:${daysLeft!==null&&daysLeft<=7?T.rose:T.muted}">${med.name} — ${daysLeft}d left</span>`:'No meds assigned', med?`openEditDM('${med.id}')`:null)).join(''):emptyLine('No family members yet.')}`)}
      ${lineCard(expiringProducts.length?`<div style="font-weight:700;margin-bottom:6px">Products expiring within ${INSIGHTS_EXPIRY_WINDOW_DAYS} days</div>${expiringProducts.map(p=>memberRow(p.name, `<span style="color:${T.rose}">${fmt(p.expiry)}</span>`, `openEditProduct('${p.id}')`)).join('')}`:emptyLine('Nothing expiring in the next '+INSIGHTS_EXPIRY_WINDOW_DAYS+' days.'))}

      ${sectionTitle(ICONS.cart,'Shopping')}
      ${lineCard(`Items still to be bought: <b>${uncheckedShoppingCount}</b>`, uncheckedShoppingCount>0?`A.mealsTab='shopping';goTo('meals')`:null)}

      ${sectionTitle(ICONS.meal,'Meals')}
      ${lineCard(`This week's meal plan is <b>${mealCompletion}%</b> filled in.`, `A.mealsTab='planner';goTo('meals')`)}

}



// ── HOME PAGE ──────────────────────────────────────────────────────────────────
function renderHome(){
  const now=new Date(); // device clock — reference for past/future timed events
  const today=todayD();
  const fmtT=d=>{if(!d)return'';const x=new Date(d);return x.getHours().toString().padStart(2,'0')+':'+x.getMinutes().toString().padStart(2,'0');};

  // ── MEMBER LABEL HELPER (v7) ─────────────────────────────────────────────
  // Returns a short text label identifying who an event/task is assigned/linked to.
  const memberLabel=e=>{
    if(e.participants_all_family) return '👨‍👩‍👧‍👦 Family';
    const ids = e.member_id ? [e.member_id] : (e.participants||[]);
    if(!ids.length) return '';
    if(ids.length===1){ const m=getMem(ids[0]); return m?m.name:''; }
    return ids.length+' members';
  };

  // ── TODAY SECTION ──────────────────────────────────────────────────────────
  // Include: events starting today + multi-day events spanning through today
  // Exclude: wellness logs, timed events whose start time has already passed,
  //          and Tasks that have already been marked complete (v7)
  const todayEvs=getEvents().filter(e=>{
    if(e.type==='wellness') return false;
    if(e.type==='task' && e.completed_at) return false; // v7: hide completed tasks
    const evStart=new Date(e.date);
    const evStartDay=new Date(evStart); evStartDay.setHours(0,0,0,0);

    // Case A: event starts today
    if(isSameDay(evStart,today)){
      if(e.all_day) return true; // all-day events always show
      return evStart>=now;       // timed: only if not yet past
    }

    // Case B: multi-day event that started before today but spans through today
    if(e.end_date){
      const evEndDay=new Date(e.end_date); evEndDay.setHours(23,59,59,999);
      return evStartDay<today && evEndDay>=today;
    }
    return false;
  });

  // Sort: all-day first, then chronologically by start time
  todayEvs.sort((a,b)=>{
    const aAllDay=a.all_day||(new Date(a.date)<today);
    const bAllDay=b.all_day||(new Date(b.date)<today);
    if(aAllDay&&!bAllDay) return -1;
    if(!aAllDay&&bAllDay) return 1;
    return new Date(a.date)-new Date(b.date);
  });

  // ── COMING UP SECTION ──────────────────────────────────────────────────────
  // Determine if today is Sunday (Mon=0 ... Sun=6)
  const isSunday=((today.getDay()+6)%7)===6;

  let weekStart, weekEnd, upcomingLabel;
  if(isSunday){
    // Show NEXT week (Mon–Sun)
    weekStart=addDays(today,1);       // next Monday
    weekEnd=addDays(today,7);         // next Sunday
    upcomingLabel='Coming up next week';
  } else {
    // Show remainder of THIS calendar week (tomorrow → this Sunday)
    weekStart=addDays(today,1);       // tomorrow
    // Find this Sunday: days until Sunday = 6 - current weekday (Mon=0)
    const daysUntilSunday=6-((today.getDay()+6)%7);
    weekEnd=addDays(today,daysUntilSunday);
    upcomingLabel='Coming up this week';
  }
  weekEnd.setHours(23,59,59,999);

  const upcomingEvs=getEvents().filter(e=>{
    if(e.type==='wellness') return false;
    if(e.type==='task' && e.completed_at) return false; // v7: hide completed tasks
    const evStart=new Date(e.date); evStart.setHours(0,0,0,0);
    return evStart>=weekStart && evStart<=weekEnd;
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));

  // ── OTHER ACTIONS (v7 — renamed from "Summary To Do") ───────────────────────
  // Scope: overdue, today, and up to 7 days ahead — but ONLY items that are
  // NOT already shown above in Today / Coming Up, to avoid duplicates.
  const weekAhead = addDays(today, 7); weekAhead.setHours(23,59,59,999);
  // IDs already visible in Today / Coming Up — exclude these from Other Actions
  const todayUpcomingIds = new Set([...todayEvs.map(e=>e.id), ...upcomingEvs.map(e=>e.id)]);
  // Calendar items: Tasks + non-task events with open actions — merged, sorted by date.
  // v21: extracted into the shared _followUpCalendarItems() helper (defined
  // near renderInsights()) so this and the Insights "Events to follow up on"
  // count can never drift out of sync. Same exact filters as before.
  const todoCalendar = _followUpCalendarItems(todayUpcomingIds);
  // Notebook notes with open checklist items (no date — sorted after calendar items)
  const todoNotes = getNotes()
    .filter(n => n.checklist?.length > 0 && n.checklist.some(c => !c.done));
  // v16: urgent, not-yet-bought shopping items — flattened across every
  // list, tagged with which list each came from + its index within that
  // list's items array (needed to check it off directly from Home via the
  // same toggleShoppingItem() the shopping list itself uses). Shown FIRST
  // in Other Actions, above Calendar/Notebook items, since these were
  // explicitly flagged urgent by a family member.
  const todoShopping = [];
  (A.shoppingLists||[]).forEach(l=>{
    (l.items||[]).forEach((item,idx)=>{
      if(item.urgent && !item.done) todoShopping.push({listId:l.id,listName:l.name,idx,item});
    });
  });
  const hasToDo = todoShopping.length > 0 || todoCalendar.length > 0 || todoNotes.length > 0;

  // ── EVENT CARD (v7: sky border, member label) ──────────────────────────────
  // showDate: when true, prefix subtitle with compact "Mon 4/6 · " date label
  const evCard=(e,showDate=false)=>{
    const evStart=new Date(e.date);
    const isSpanning=e.end_date&&!isSameDay(e.date,e.end_date)&&evStart<today;
    const timeStr=e.all_day||isSpanning?'All day':fmtT(e.date);
    let subtitle='';
    if(showDate){
      const dn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      const dayLabel=dn[(evStart.getDay()+6)%7];
      const dateLabel=`${evStart.getDate()}/${evStart.getMonth()+1}`;
      subtitle=`${dayLabel} ${dateLabel} · ${timeStr}`;
    } else {
      subtitle=timeStr;
    }
    const mLbl=memberLabel(e);
    if(mLbl) subtitle+=' · '+mLbl;
    if(e.location) subtitle+=' · '+e.location;
    // v7: all Today/Coming Up cards use a consistent sky-blue border (matches legend)
    return `<div onclick="viewEv('${e.id}')" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:#fff;border-left:3px solid ${T.sky};margin-bottom:6px;cursor:pointer">
      <span style="font-size:16px">${ET[e.type].icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.series_id?'🔁 ':''}${e.title||ET[e.type].label}</div>
        <div style="font-size:11px;color:${T.muted}">${subtitle}</div>
      </div>
    </div>`;
  };

  document.getElementById('page-home').innerHTML=`
    <div class="page-header">
      <div class="page-title" style="font-size:20px">Good ${new Date().getHours()<12?'morning':'afternoon'} 👋</div>
    </div>
    <div style="padding:12px 16px">

      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button onclick="showPicker(new Date())" style="flex:1;padding:12px;border-radius:12px;background:${T.sage};color:#fff;border:none;font-weight:700;font-size:13px;cursor:pointer">+ Calendar Entry</button>
        <button onclick="A.mealsTab='shopping';goTo('meals')" style="flex:1;padding:12px;border-radius:12px;background:${T.honeyLight};color:${T.honey};border:1px solid ${T.honey}44;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px">${ICONS.cart} Shopping</button>
      </div>

      <div style="font-weight:800;font-size:14px;color:${T.ink};margin-bottom:8px">Today — ${fmt(today)}</div>
      ${todayEvs.length?todayEvs.map(e=>evCard(e,false)).join(''):`<div style="font-size:13px;color:${T.muted};padding:10px 0;font-style:italic">No upcoming events today. Enjoy the rest of the day!</div>`}

      ${upcomingEvs.length?`
      <div style="font-weight:800;font-size:14px;color:${T.ink};margin:14px 0 8px">${upcomingLabel}</div>
      ${upcomingEvs.map(e=>evCard(e,true)).join('')}`:''}

      ${hasToDo ? `
      <div style="font-weight:800;font-size:14px;color:${T.ink};margin:14px 0 4px">Other Actions</div>
      <div style="font-size:11px;color:${T.muted};margin-bottom:8px;line-height:1.5">Tasks and notes with open action items due within the next 7 days, or already overdue, plus any items flagged urgent on your shopping lists — all shown here so nothing gets missed.</div>
      ${todoShopping.map(({listId,listName,idx,item}) => {
        return `<div style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:#fff;border-left:3px solid ${T.rose};margin-bottom:6px">
          <input type="checkbox" onchange="toggleShoppingItem('${listId}',${idx},this.checked)" style="flex-shrink:0;width:18px;height:18px;cursor:pointer">
          <div style="flex:1;min-width:0;cursor:pointer" onclick="openShoppingList('${listId}')">
            <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🛒 ${item.text||''}</div>
            <div style="font-size:11px;color:${T.muted}">Shopping item · ${listName}</div>
          </div>
        </div>`;
      }).join('')}
      ${todoCalendar.map(e => {
        const isTask = e.type === 'task';
        const isOverdue = new Date(e.date) < today;
        const openCount = (e.actions||[]).filter(a=>!a.done).length;
        const icon = isTask ? '✅' : ET[e.type].icon;
        const mLbl = memberLabel(e);
        const subtitle = isTask
          ? `${isOverdue?'⚠️ Overdue · ':''}Due: ${fmt(e.date)}${mLbl?' · '+mLbl:''}${openCount>0?' · '+openCount+' open item'+(openCount!==1?'s':''):''}`
          : `${fmt(e.date)} · ${openCount} open item${openCount!==1?'s':''}${mLbl?' · '+mLbl:''}`;
        return `<div onclick="viewEv('${e.id}')" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:#fff;border-left:3px solid ${T.sky};margin-bottom:6px;cursor:pointer">
          <span style="font-size:16px">${icon}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.series_id?'🔁 ':''}${e.title||(isTask?'Untitled Task':ET[e.type].label)}</div>
            <div style="font-size:11px;color:${isTask&&isOverdue?T.rose:T.muted}">${subtitle}</div>
          </div>
        </div>`;
      }).join('')}
      ${todoNotes.map(n => {
        const grp = getGroups().find(g=>g.id===n.group_id);
        const openCount = n.checklist.filter(c=>!c.done).length;
        return `<div onclick="openNote('${n.id}')" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:#fff;border-left:3px solid ${T.sage};margin-bottom:6px;cursor:pointer">
          <span style="font-size:16px">📓</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.title||'Untitled Note'}</div>
            <div style="font-size:11px;color:${T.muted}">${grp?grp.name+' · ':''}${openCount} open item${openCount!==1?'s':''}</div>
          </div>
        </div>`;
      }).join('')}
      ` : ''}

      <!-- v21: static Insights teaser — no live numbers, per spec. -->
      <div onclick="goTo('insights')" style="cursor:pointer;background:linear-gradient(135deg,${T.sage},${T.sageMid});border-radius:14px;padding:14px 16px;margin-top:16px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div style="font-size:13px;font-weight:700;line-height:1.4">See how your family's week is shaping up →</div>
        <span style="font-size:20px;flex-shrink:0">🌿</span>
      </div>

      <!-- v7: color-guide legend now always shown at the bottom of Home -->
      <div style="margin-top:16px;padding-top:10px;border-top:1px solid ${T.border};display:flex;gap:14px;flex-wrap:wrap;align-items:center">
        <span style="font-size:10px;font-weight:700;color:${T.muted};text-transform:uppercase;letter-spacing:.04em">Color guide</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:${T.muted}"><span style="width:10px;height:10px;border-radius:2px;background:${T.sky};flex-shrink:0;display:inline-block"></span>Calendar item</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:${T.muted}"><span style="width:10px;height:10px;border-radius:2px;background:${T.sage};flex-shrink:0;display:inline-block"></span>Notebook note</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:${T.muted}"><span style="width:10px;height:10px;border-radius:2px;background:${T.rose};flex-shrink:0;display:inline-block"></span>Shopping item</span>
      </div>

    </div>`;
}

      <button class="btn btn-primary btn-sm" onclick="createShoppingList()" style="flex-shrink:0">+ New List</button>

  // already checked?" without opening each list one by one.

  }

  return headerHtml+(lists.length?lists.map(l=>{

    </div>`;
  }).join(''):
  `<div style="text-align:center;padding:20px;color:${T.muted}">
    <div style="font-size:32px;margin-bottom:8px">🛒</div>

// v20: Shared write helper for Shopping Lists — every write to the
// shopping_lists table routes through here so updated_at/updated_by_name
// (Timestamps) can never be missed by a future write path. Callers pass
// whatever fields they were already writing (e.g. {items} or {name}); this
// merges in the timestamp fields automatically. Pass {select:true} as a
// third argument for the one call site (saveShoppingListName) that needs
// the updated row back.
//
// v20 fix (staging feedback): two issues found in testing —
// 1) The "Last edited" line only updated after a full page refresh, because
//    the DB write succeeded but the in-memory `list` object was never
//    updated to match — fixed by syncing local state here, in the one
//    shared place, right after a successful write.
// 2) Loading feedback was inconsistent across the 9 call sites (only
//    saveShoppingListName showed the standard "Saving…" spinner toast used
//    elsewhere in the app). Now consistent everywhere by default. Pass
//    {silent:true} to skip it for actions that should feel instant — used
//    by reorderShoppingItems(), matching its existing "should feel instant"
//    design intent.
async function touchList(listId, extraFields, opts={}){
  const payload={
    ...extraFields,
    updated_at:new Date().toISOString(),
    updated_by_name:getActorName()
  };
  let q=sb.from('shopping_lists').update(payload).eq('id',listId);
  if(opts.select) q=q.select().single();
  if(!opts.silent) showSavingToast();
  const result=await sbWrite(()=>q);
  if(!opts.silent) hideSavingToast();
  if(!result.error){
    const list=A.shoppingLists.find(l=>l.id===listId);
    if(list){ list.updated_at=payload.updated_at; list.updated_by_name=payload.updated_by_name; }
  }
  return result;
}
window.touchList=touchList;

function renderShoppingModal(id){
  // v9: capture scroll position before rebuilding the modal HTML, so any
  // action that re-renders (checking an item, adding an item, toggling
  // "Hide completed") doesn't reset the user back to the top of a long list.
  const _prevScrollTop=document.querySelector('.modal-body')?.scrollTop;
  const list=A.shoppingLists.find(l=>l.id===id);
  if(!list)return;
  const items=list.items||[];
  const doneCount=items.filter(i=>i.done).length;
  const hideDone=A._shopHideDone;
  const searchQ=(A._shopSearchQ||'').toLowerCase().trim();
  const itemRow=(item,idx)=>{
    if(hideDone&&item.done)return'';
    if(searchQ&&!(item.text||'').toLowerCase().includes(searchQ))return'';
    // v9: item text is now an editable input instead of a read-only span,
    // styled to visually match the old span (borderless, transparent,
    // strikethrough preserved when done). Saves silently on blur/Enter via
    // updateShoppingItemText — no re-render, so no scroll jump.
    return`<div class="shop-item-row" draggable="true" data-idx="${idx}" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;background:#fff;border:1px solid ${T.border};border-radius:9px;padding:6px 8px">
      <span class="drag-handle" style="cursor:grab;color:#c8bfb0;font-size:14px;flex-shrink:0;user-select:none;touch-action:none">⠿</span>
      <input type="checkbox" ${item.done?'checked':''} onchange="toggleShoppingItem('${id}',${idx},this.checked)">
      <button onclick="toggleItemUrgent('${id}',${idx})" title="${item.urgent?'Remove urgent flag':'Mark urgent — shows on Home Page'}" style="background:none;border:none;font-size:15px;cursor:pointer;padding:2px 4px;flex-shrink:0;color:${item.urgent?T.rose:'#c8bfb0'}">${item.urgent?'★':'☆'}</button>
      <input type="text" value="${(item.text||'').replace(/"/g,'&quot;')}"
        style="flex:1;min-width:0;font-size:13px;border:none;background:transparent;padding:2px 0;font-family:inherit;color:${item.done?T.muted:T.ink};text-decoration:${item.done?'line-through':'none'}"
        onblur="updateShoppingItemText('${id}',${idx},this.value)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">
      <button onclick="removeShoppingItem('${id}',${idx})" style="background:none;border:none;color:${T.muted};font-size:16px;cursor:pointer;padding:2px 4px">×</button>
    </div>`;
  };
  const rows=items.map((item,idx)=>itemRow(item,idx)).join('');
  // v15: visible count (for the empty-state message below) now accounts for
  // both the "Hide completed" toggle AND the per-list search filter.
  const visibleCount=items.filter(i=>(!hideDone||!i.done)&&(!searchQ||(i.text||'').toLowerCase().includes(searchQ))).length;
  const emptyMsg = items.length===0
    ? 'No items yet — add your first item below'
    : (searchQ ? `No items match "${A._shopSearchQ}"` : 'All items completed — toggle above to view');
  showModal(`🛒 ${list.name}`,`
    ${(()=>{ // v20: small muted "Last edited" line — renders nothing for lists with no edit history yet
      const _le=formatLastEdited(list.updated_at,list.updated_by_name);
      return _le?`<div style="font-size:11px;color:${T.muted};margin-bottom:8px;opacity:0.85">${_le}</div>`:'';
    })()}
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:${T.muted};margin-bottom:10px;cursor:pointer">
      <input type="checkbox" ${hideDone?'checked':''} onchange="A._shopHideDone=this.checked;renderShoppingModal('${id}')">
      👁 Hide completed (${doneCount})
    </label>
    ${items.length>4?`
    <div style="position:relative;margin-bottom:10px">
      <input class="inp" id="shop-search-list-inp" placeholder="🔍  Search this list…" value="${A._shopSearchQ||''}"
        style="padding-right:${A._shopSearchQ?'36px':'12px'}"
        oninput="A._shopSearchQ=this.value;clearTimeout(A._slT);A._slT=setTimeout(()=>{renderShoppingModal('${id}');const si=document.getElementById('shop-search-list-inp');if(si){si.focus();si.setSelectionRange(si.value.length,si.value.length);}},250)"
        onkeydown="if(event.key==='Enter'){clearTimeout(A._slT);renderShoppingModal('${id}');this.blur();}">
      <button id="shop-search-list-x" onclick="A._shopSearchQ='';renderShoppingModal('${id}')"
        style="display:${A._shopSearchQ?'flex':'none'};position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:${T.muted};font-size:16px;cursor:pointer;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%">×</button>
    </div>`:''}
    <div id="shop-items-${id}">
      ${visibleCount?rows:`<div style="text-align:center;color:${T.muted};font-size:12px;padding:10px 0">${emptyMsg}</div>`}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input class="inp" id="shop-new-item" placeholder="Add item…" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addShoppingItem('${id}');}">
      <button class="btn btn-primary btn-sm" onclick="addShoppingItem('${id}')">Add</button>

  `);

  // (both run in this one setTimeout — no extra async tick needed)
  setTimeout(()=>{
    initShoppingDrag(id);
    const mb=document.querySelector('.modal-body');
    if(mb&&_prevScrollTop)mb.scrollTop=_prevScrollTop;

// v9: silently saves an edited item's text without triggering a full modal
// re-render (which would reset scroll position). Reverts to the original
// text if the field is cleared; no-ops if the text is unchanged.
async function updateShoppingItemText(listId,idx,newText){
  const list=A.shoppingLists.find(l=>l.id===listId);
  if(!list)return;
  const items=list.items||[];
  const item=items[idx];
  if(!item)return;
  const trimmed=(newText||'').trim();
  if(!trimmed){
    // Cleared field — revert the input to the original text, don't save a blank item
    const inp=document.querySelector(`#shop-items-${listId} .shop-item-row[data-idx="${idx}"] input[type="text"]`);
    if(inp)inp.value=item.text;
    return;
  }
  if(trimmed===item.text)return; // unchanged — nothing to save
  const newItems=items.map((it,i)=>i===idx?{...it,text:trimmed}:it);
  list.items=newItems;
  const{error}=await touchList(listId,{items:newItems});
  if(error){toast('Error saving item.',true);console.error(error);}
}
window.updateShoppingItemText=updateShoppingItemText;

// Mouse + touch drag-to-reorder for shopping list items
function initShoppingDrag(listId){
  const cont=document.getElementById('shop-items-'+listId);
  if(!cont)return;
  let dragging=null;
  cont.querySelectorAll('.shop-item-row').forEach(row=>{
    row.addEventListener('dragstart',()=>{ row.style.opacity='0.4'; dragging=row; });
    row.addEventListener('dragend',()=>{ row.style.opacity='1'; if(dragging)reorderShoppingItems(listId,cont); dragging=null; });
    row.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragging||dragging===row)return;
      const r=row.getBoundingClientRect();
      if(e.clientY<r.top+r.height/2)cont.insertBefore(dragging,row);
      else cont.insertBefore(dragging,row.nextSibling);
    });
    const handle=row.querySelector('.drag-handle');
    handle.addEventListener('touchstart',()=>{ row.style.opacity='0.5'; dragging=row; },{passive:true});
    handle.addEventListener('touchmove',e=>{
      e.preventDefault();
      const y=e.touches[0].clientY;
      cont.querySelectorAll('.shop-item-row').forEach(el=>{
        if(el===dragging)return;
        const r=el.getBoundingClientRect();
        if(y>r.top&&y<r.bottom){
          if(y<r.top+r.height/2)cont.insertBefore(dragging,el);
          else cont.insertBefore(dragging,el.nextSibling);
        }
      });
    },{passive:false});
    handle.addEventListener('touchend',()=>{ row.style.opacity='1'; if(dragging)reorderShoppingItems(listId,cont); dragging=null; });
  });
}
window.initShoppingDrag=initShoppingDrag;

// Persist new item order after a drag. Items currently hidden by "Hide completed"
// keep their relative order and are appended after the visible (reordered) items.
async function reorderShoppingItems(listId,cont){
  const list=A.shoppingLists.find(l=>l.id===listId);
  if(!list)return;
  const items=list.items||[];
  // v22 fix: previously this always pushed every HIDDEN item (filtered out
  // by "Hide completed" or the per-list search box) to the very END of the
  // array — silently relocating items the user never touched, and worse
  // every time a drag happened under these conditions. Fixed merge
  // strategy: hidden items keep their EXACT original index; only the
  // indices that belonged to visible items get refilled, in order, with
  // the drag-resulting visible order — so nothing outside the drag
  // selection ever moves.
  const shownIdx=Array.from(cont.querySelectorAll('.shop-item-row')).map(row=>parseInt(row.dataset.idx));
  const shownSet=new Set(shownIdx);
  const newItems=new Array(items.length);
  let visiblePtr=0;
  for(let i=0;i<items.length;i++){
    if(shownSet.has(i)){
      // This original slot belonged to a visible item — fill it with the
      // next item from the drag-resulting visible order.
      newItems[i]=items[shownIdx[visiblePtr]];
      visiblePtr++;
    }else{
      // This original slot belonged to a hidden item — leave it exactly
      // where it was.
      newItems[i]=items[i];
    }
  }
  list.items=newItems;
  // v10 (UX hardening): sbWrite() + error toast. No loading state — drag-to-
  // reorder should feel instant. Always re-render regardless of outcome.
  const{error}=await touchList(listId,{items:newItems},{silent:true});
  if(error){toast('Error saving new order.',true);console.error(error);}
  // v14: keep the Shopping tab page behind this modal in sync too — it was
  // previously only refreshed by leaving and returning to the Meals tab.
  renderMeals();
  renderShoppingModal(listId);
}
window.reorderShoppingItems=reorderShoppingItems;

async function addShoppingItem(listId){
  const inp=document.getElementById('shop-new-item');
  const text=inp?.value?.trim();
  if(!text)return;
  const list=A.shoppingLists.find(l=>l.id===listId);
  if(!list)return;
  const newItem={id:(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),text,done:false};
  const items=[...(list.items||[]),newItem];
  // v10 (UX hardening): brief disable of the inline Add button + sbWrite().
  // Timing bug fix: local state (list.items) now only updates AFTER the DB
  // write is confirmed, so a failed write never leaves stale local state.
  const _addBtn=inp?.nextElementSibling;
  if(_addBtn){_addBtn.disabled=true;_addBtn.style.opacity='0.7';}
  try{
    const{error}=await touchList(listId,{items});
    if(error){toast('Error adding item.',true);console.error(error);return;}
    list.items=items;
    // v8: notify other family members
    writeNotif('shopping','updated',`${getActorName()} added to a shopping list`,text);
    // v14: keep the Shopping tab page behind this modal in sync too.
    renderMeals();
    renderShoppingModal(listId);
  }catch(e){
    toast('Something went wrong — please try again.',true);console.error(e);
  }finally{
    if(_addBtn){_addBtn.disabled=false;_addBtn.style.opacity='';}
  }
}
window.addShoppingItem=addShoppingItem;

async function resetShoppingList(listId){
  const list=A.shoppingLists.find(l=>l.id===listId);
  if(!list)return;
  const items=(list.items||[]).map(i=>({...i,done:false}));
  // v10 (UX hardening): disable the reset button during the write + sbWrite().
  // This is the only .btn-secondary.btn-full button in this modal.
  const _resetBtn=document.querySelector('.modal-body .btn-secondary.btn-full');
  if(_resetBtn){_resetBtn.disabled=true;_resetBtn.style.opacity='0.7';}
  try{
    const{error}=await touchList(listId,{items});
    if(error){toast('Error resetting list.',true);console.error(error);return;}
    list.items=items;
    toast('All items unchecked! ✅');
    // v14: keep the Shopping tab page behind this modal in sync too.
    renderMeals();
    renderShoppingModal(listId);
  }catch(e){
    toast('Something went wrong — please try again.',true);console.error(e);
  }finally{
    if(_resetBtn){_resetBtn.disabled=false;_resetBtn.style.opacity='';}
  }
}

// Toggling an item to "done" saves instantly and shows a 5-second Undo toast
async function toggleShoppingItem(listId,idx,checked){
  const list=A.shoppingLists.find(l=>l.id===listId);
  if(!list)return;
  const items=[...(list.items||[])];
  if(!items[idx])return;
  items[idx]={...items[idx],done:checked};
  // v10 (UX hardening): timing bug fix — local state only updates after a
  // confirmed DB write. On failure, re-render from the unchanged saved state
  // so the checkbox visually reverts instead of showing a state that was
  // never actually saved.
  const{error}=await touchList(listId,{items});
  if(error){
    toast('Error saving — please try again.',true);console.error(error);
    renderShoppingModal(listId);
    return;
  }
  list.items=items;
  // v22: notify the family when an item is CHECKED (not unchecked) — same
  // asymmetry already used for the urgent-flag toggle just below in this
  // file. Reuses the existing notif_shopping preference; no new Settings
  // toggle needed, and respects that preference automatically if a family
  // has already turned Shopping notifications off.
  if(checked){
    writeNotif('shopping','updated',`${getActorName()} checked off a shopping item`,items[idx].text||'');
  }
  if(checked) showShopUndoToast(listId,idx);
  // v14: keep the Shopping tab page behind this modal in sync too.
  renderMeals();
  // v16: this function is now also called from the Home Page's "Other
  // Actions" urgent-item checkbox, where no shopping-list modal is open. Only
  // re-render the modal if it's actually showing THIS list right now —
  // otherwise this would unexpectedly pop the shopping modal open over
  // whatever page the person is actually looking at.
  if(document.getElementById('shop-items-'+listId)) renderShoppingModal(listId);
  renderHome();
}
window.toggleShoppingItem=toggleShoppingItem;

// v16: toggles the "urgent" flag on a shopping list item. Urgent + not-yet-
// bought items surface at the top of the Home Page "Other Actions" section
// (see renderHome()) so critical purchases can't get lost in a long list.
// Notifies the family only when an item is newly flagged urgent — not when
// un-flagging or checking it off, matching how checking an item off already
// doesn't notify either.
async function toggleItemUrgent(listId,idx){
  const list=A.shoppingLists.find(l=>l.id===listId);
  if(!list)return;
  const items=[...(list.items||[])];
  if(!items[idx])return;
  const newUrgent=!items[idx].urgent;
  items[idx]={...items[idx],urgent:newUrgent};
  const{error}=await touchList(listId,{items});
  if(error){toast('Error saving — please try again.',true);console.error(error);return;}
  list.items=items;
  if(newUrgent){
    // v8-style family notification, reusing the existing "Shopping list
    // items added" activity preference rather than introducing a new one.
    writeNotif('shopping','updated',`${getActorName()} flagged an item as urgent`,items[idx].text||'');
  }
  renderMeals();
  // Same guard as toggleShoppingItem — only refresh the modal if it's the
  // one currently open, so this never force-opens a modal unexpectedly.
  if(document.getElementById('shop-items-'+listId)) renderShoppingModal(listId);
  renderHome();
}
window.toggleItemUrgent=toggleItemUrgent;

// Save the entire grid as one JSON object — single shared row per family (upsert).
// v7: uses Postgres UPSERT via ON CONFLICT DO UPDATE (family_id has a UNIQUE
// constraint after the dedup migration). This is safer and simpler than the
// "update if exists, else insert" pattern used in v6.
async function saveMealPlan(isSilent=false){
  if(!A.family){if(!isSilent)toast('Set up your family first.',true);return;}
  const plan_data={};
  MEAL_PLAN_ROWS.forEach(row=>{
    plan_data[row]={};
    MEAL_PLAN_DAYS.forEach(day=>{
      plan_data[row][day]=document.getElementById(`mp-${row}-${day}`)?.value||'';
    });
  });
  const upsertRow={
    family_id:A.family.id,
    plan_data,
    updated_at:new Date().toISOString(),
  };
  // v10 (UX hardening): showSavingToast()/hideSavingToast() + sbWrite() for
  // idle-safety. This Save button is inline on the planner page (not inside
  // a modal), so Pattern C (toast only, no button disable) applies.
  // v13: update the status indicator too; only show the full saving toast on
  // an explicit (non-silent) save — the 3-second auto-save stays quiet.
  const _mpStatus=document.getElementById('meal-plan-status');
  if(_mpStatus){_mpStatus.textContent='● Saving…';_mpStatus.style.color='#7a7060';}
  if(!isSilent) showSavingToast();
  try{
    // .upsert() inserts a new row or updates the existing one on family_id conflict
    const{data,error}=await sbWrite(()=>sb.from('meal_plans')
      .upsert(upsertRow,{onConflict:'family_id'})
      .select()
      .single());
    if(error){
      if(_mpStatus){_mpStatus.textContent='⚠ Save failed';_mpStatus.style.color='#b85070';}
      if(!isSilent){toast('Error saving menu: '+(error.message||'unknown'),true);console.error(error);}
      return;
    }
    A.mealPlan=data;
    A._mealPlanDirty=false; // v14
    clearMealPlanDraftLS(); // v14: successfully synced — discard the localStorage draft
    // v8: notify family members on explicit saves only — not on every 3-second auto-save
    if(!isSilent) writeNotif('meal','updated',`${getActorName()} updated the weekly menu`,'Meal Planner');
    const now=new Date();
    const t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
    if(_mpStatus){_mpStatus.textContent=isSilent?`✓ Auto-saved at ${t}`:`✓ Saved at ${t}`;_mpStatus.style.color='#5e8b62';}
    if(!isSilent) toast('Weekly menu saved! ✅');
  }catch(e){
    if(_mpStatus){_mpStatus.textContent='⚠ Save failed';_mpStatus.style.color='#b85070';}
    if(!isSilent){toast('Something went wrong — please try again.',true);console.error(e);}
  }finally{
    if(!isSilent) hideSavingToast();
  }
}
window.saveMealPlan=saveMealPlan;

// ── MEAL PLANNER AUTO-SAVE (v13) ──────────────────────────────────────────────
// 3-second debounce: fires after the user stops typing in any planner cell.
// Saves silently (no toast) — only the status indicator updates.
function scheduleMealPlanAutoSave(){
  A._mealPlanDirty=true;
  const status=document.getElementById('meal-plan-status');
  if(status){status.textContent='● Unsaved';status.style.color='#c4892a';}
  // v14: snapshot to localStorage on every keystroke-triggered cycle, not just
  // when the 3-second remote debounce completes — same draft-safety pattern
  // as Notebook (see checkAndOfferMealDraft below), for the same reason: a
  // backgrounded/discarded tab can beat the debounce timer to the punch.
  saveMealPlanDraftLS();
  clearTimeout(A._mealPlanAutoSaveTimer);
  A._mealPlanAutoSaveTimer=setTimeout(()=>saveMealPlan(true),3000);
}
window.scheduleMealPlanAutoSave=scheduleMealPlanAutoSave;

// ── MEAL PLANNER DRAFT SAFETY (v14) ───────────────────────────────────────────
// Same pattern and same reasoning as Notebook's draft safety net above: the
// grid's 3-second auto-save only writes to Supabase, so a backgrounded/
// discarded tab can lose unsaved edits before that timer fires. Meal Planner
// has no per-note "editor" to reopen — it's a single shared grid — so the
// restore prompt simply switches to the Meals > Planner tab and refills it.

const _mealDraftKey=()=>'ks_meal_draft_'+(A.family?.id||'anon');
const _mealDraftMaxAge=2*60*60*1000; // discard drafts older than 2 hours

function saveMealPlanDraftLS(){
  if(!A.family) return;
  const table=document.getElementById('meal-plan-table');
  if(!table) return; // grid isn't on screen right now — nothing to draft
  const plan_data={};
  MEAL_PLAN_ROWS.forEach(row=>{
    plan_data[row]={};
    MEAL_PLAN_DAYS.forEach(day=>{
      plan_data[row][day]=document.getElementById(`mp-${row}-${day}`)?.value||'';
    });
  });
  const draft={timestamp:Date.now(),plan_data};
  try{localStorage.setItem(_mealDraftKey(),JSON.stringify(draft));}catch(_){}
}
window.saveMealPlanDraftLS=saveMealPlanDraftLS;

function clearMealPlanDraftLS(){
  try{localStorage.removeItem(_mealDraftKey());}catch(_){}
}
window.clearMealPlanDraftLS=clearMealPlanDraftLS;

// Checked once at app boot (see boot() below). Only offers restoration if the
// draft is actually newer than the last saved plan — otherwise it's stale
// leftover from a session that already completed normally.
function checkAndOfferMealDraft(){
  if(!A.family) return;
  let draft;
  try{
    const raw=localStorage.getItem(_mealDraftKey());
    if(!raw) return;
    draft=JSON.parse(raw);
  }catch(_){return;}
  if(!draft||!draft.timestamp||Date.now()-draft.timestamp>_mealDraftMaxAge){
    clearMealPlanDraftLS();return;
  }
  const savedAt=A.mealPlan?.updated_at?new Date(A.mealPlan.updated_at).getTime():0;
  if(draft.timestamp<=savedAt){ clearMealPlanDraftLS(); return; }
  const existing=document.getElementById('meal-draft-banner');
  if(existing) existing.remove();
  const banner=document.createElement('div');
  banner.id='meal-draft-banner';
  banner.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:#1e1b16;color:#fff;border-radius:12px;padding:12px 14px;z-index:500;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:fadeUp .3s ease';
  const draftDate=new Date(draft.timestamp);
  const tStr=draftDate.getHours().toString().padStart(2,'0')+':'+draftDate.getMinutes().toString().padStart(2,'0');
  banner.innerHTML=`
    <div style="min-width:0">
      <div style="font-weight:700;font-size:13px">📝 Unfinished weekly menu edits</div>
      <div style="font-size:11px;opacity:.75;margin-top:2px">Draft from ${tStr} — newer than what's currently saved</div>
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button onclick="document.getElementById('meal-draft-banner')?.remove();clearMealPlanDraftLS()" style="background:rgba(255,255,255,.15);border:none;border-radius:8px;color:#fff;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent">Discard</button>
      <button onclick="document.getElementById('meal-draft-banner')?.remove();restoreMealPlanDraftLS()" style="background:#5e8b62;border:none;border-radius:8px;color:#fff;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent">Restore ✓</button>
    </div>`;
  document.body.appendChild(banner);
  setTimeout(()=>document.getElementById('meal-draft-banner')?.remove(),15000); // auto-dismiss
  return 'meal-draft-banner'; // v17: tells the sequencing orchestrator a banner is now showing
}
window.checkAndOfferMealDraft=checkAndOfferMealDraft;

// Switches to Meals > Planner (creating the grid in the DOM if needed) then
// refills it from the draft once the grid textareas exist.
function restoreMealPlanDraftLS(){
  let draft;
  try{
    const raw=localStorage.getItem(_mealDraftKey());
    if(!raw) return;
    draft=JSON.parse(raw);
  }catch(_){return;}
  if(!draft) return;
  A.mealsTab='planner';
  goTo('meals');
  setTimeout(()=>{
    const pd=draft.plan_data||{};
    MEAL_PLAN_ROWS.forEach(row=>{
      MEAL_PLAN_DAYS.forEach(day=>{
        const el=document.getElementById(`mp-${row}-${day}`);
        if(el) el.value=pd[row]?.[day]||'';
      });
    });
    A._mealPlanDirty=true;
    const status=document.getElementById('meal-plan-status');
    if(status){status.textContent='● Unsaved changes';status.style.color='#c4892a';}
    toast('Draft restored ✓');
  },100);
}
window.restoreMealPlanDraftLS=restoreMealPlanDraftLS;

async function saveProduct(){
  if(!A.family){toast('Set up your family first.',true);return;}
  const name=document.getElementById('ap-name')?.value?.trim();
  if(!name){toast('Please enter an item name.',true);return;}
  const data={
    family_id:A.family.id,
    name,
    category:document.getElementById('ap-cat')?.value||null,
    unit:document.getElementById('ap-unit')?.value||null,
    stock:parseFloat(document.getElementById('ap-stock')?.value)||0,
    cost:parseFloat(document.getElementById('ap-cost')?.value)||null,
    // v7: save "in stock since" date for the Products tab
    stock_date:document.getElementById('ap-sd')?.value||toISOLocal(new Date()),
    expiry:document.getElementById('ap-exp')?.value?new Date(document.getElementById('ap-exp').value).toISOString():null,
    notes:document.getElementById('ap-notes')?.value||null,
  };
  // v10 (UX hardening): button-disable + saving toast + sbWrite() for idle-safety.
  const _saveBtn=document.querySelector('.modal-body button.btn-primary');
  if(_saveBtn){_saveBtn.disabled=true;_saveBtn.dataset.origText=_saveBtn.textContent;_saveBtn.textContent='Saving…';_saveBtn.style.opacity='0.7';}
  showSavingToast();

async function saveFamName(){
  const name=document.getElementById('s-fn')?.value?.trim();
  if(!name){toast('Please enter a family name.',true);return;}
  // v13 fix: previously this function only handled RENAMING an existing
  // family (an UPDATE), so a brand-new user with no family yet always hit
  // the "!A.family" guard below and got a misleading "Please enter a family
  // name" error even after typing one — there was no INSERT path anywhere
  // in the app to actually create a first family. Handle that case here.
  if(!A.family){
    if(!A.user){toast('Please sign in first.',true);return;}
    const{data,error}=await sbWrite(()=>sb.from('families').insert({owner_id:A.user.id,name}).select().single());
    if(error){toast('Error creating family: '+(error.message||'please try again.'),true);console.error(error);return;}
    A.family=data;
    // Add the signed-in user as the first (owner) family member so they
    // show up everywhere members are listed — same as any other member.
    const ownerName=A.user.user_metadata?.name||A.user.email?.split('@')[0]||'Me';
    const{data:memData,error:memErr}=await sbWrite(()=>sb.from('family_members').insert({
      family_id:data.id,user_id:A.user.id,name:ownerName,email:A.user.email||null,
      is_owner:true,avatar:ownerName[0].toUpperCase()
    }).select().single());
    if(memErr){
      console.error(memErr);
      toast('Family created, but adding you as a member failed — please add yourself under Family Members.',true);
    }else if(memData){
      A.members.push(memData);
    }
    document.getElementById('fam-badge').textContent=data.name;
    // Sample mode was showing as a placeholder because there was no real
    // family yet — turn it off now that one exists, and hide its button.
    const sBtn=document.getElementById('sample-btn');
    if(sBtn) sBtn.style.display='none';
    if(isSampleMode()) toggleSampleMode();
    // v18: create the default 'free' subscription row for this new family.
    // Fire-and-forget — the enforcement logic that reads this table lands in
    // a later pass, but the row needs to exist from day one so no family is
    // ever missing one. A failure here doesn't block family creation.
    sb.from('family_subscription').insert({family_id:data.id,plan_name:'free'})
      .then(({error})=>{ if(error) console.error('family_subscription row creation failed', error); });
    toast('Family created! ✅');
    renderSettings();
    return;
  }
  // v10 (UX hardening): sbWrite() for idle-safety (inline settings page, no modal).
  const{data,error}=await sbWrite(()=>sb.from('families').update({name}).eq('id',A.family.id).select().single());
  if(error){toast('Error saving.',true);console.error(error);return;}
  A.family=data;
  document.getElementById('fam-badge').textContent=data.name;
  toast('Family name saved! ✅');renderSettings();
}
window.saveFamName=saveFamName;

// Toggles a single action item on an event and saves instantly.
// Automatically sets or clears completed_at based on whether all actions are done.
async function toggleEvAction(evId, actionIdx, done) {
  if (isSampleMode()) return;
  const ev = A.events.find(e => e.id === evId);
  if (!ev) return;
  const actions = (ev.actions || []).map((a, i) => i === actionIdx ? {...a, done} : a);
  const allDone = actions.length > 0 && actions.every(a => a.done);
  const completedAt = allDone ? new Date().toISOString() : null;
  const { error } = await sb.from('events')
    .update({ actions, completed_at: completedAt })
    .eq('id', evId);
  if (error) { toast('Error saving.', true); return; }
  A.events = A.events.map(e => e.id === evId ? {...e, actions, completed_at: completedAt} : e);
  // Update label strikethrough in-place — no full modal re-render needed
  const lbl = document.getElementById(`ev-action-lbl-${actionIdx}`);
  if (lbl) {
    lbl.style.textDecoration = done ? 'line-through' : 'none';
    lbl.style.color = done ? T.muted : T.ink;
  }
  // Update the completion banner without re-rendering the modal
  const banner = document.getElementById('ev-completion-banner');
  if (banner) {
    if (allDone) {
      const x = new Date(completedAt);
      const t = x.getHours().toString().padStart(2,'0') + ':' + x.getMinutes().toString().padStart(2,'0');
      banner.innerHTML = `<div style="display:inline-flex;align-items:center;gap:6px;background:${T.sageLight};color:${T.sage};border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;margin-bottom:10px">✅ Completed ${fmt(completedAt)} at ${t}</div>`;
    } else {
      banner.innerHTML = '';
    }
  }
  // v7: keep Home's "Other Actions" / Today sections in sync with this change
  renderHome();
}

// Toggles a single checklist item on a note and saves the full note instantly.
// Automatically sets or clears completed_at based on whether all items are done.
async function toggleNoteItem(noteId, itemIdx, done) {
  if (!noteId || isSampleMode()) return;
  const cont = document.getElementById('ne-cl');

  // Read live checklist state from DOM (captures user's click before we write)

// ── BOOT ──────────────────────────────────────────────────────────────────────
// ── NOTIFICATIONS (v8) ────────────────────────────────────────────────────────
// Two-layer in-app notification system:
//   Layer 1 — Activity: stored in DB, written on any family data change.
//              Only other family members' actions are shown (own actions filtered out).
//              7-day retention, max 50 per load.
//   Layer 2 — Alerts: computed fresh from existing data on every panel open.
//              Low stock meds, expiring products, overdue tasks, events soon.

let _notifications = []; // Cached activity notifications from DB
let _notifPanelOpen = false;

// Returns the full set of default notification preferences (all enabled)
function getDefaultNotifPrefs() {
  return {
    notif_member_join: true,
    notif_event: true,
    notif_note: true,
    notif_shopping: true,
    notif_meal: true,
    notif_inventory_meds: true,
    notif_inventory_products: true,
    alert_low_stock: true,
    alert_expiring: true,
    alert_overdue: true,
    alert_event_start: true,
  };
}

// Returns merged preferences: saved family prefs override defaults.
function getNotifPrefs() {
  const defaults = getDefaultNotifPrefs();
  const saved = A.family?.notif_preferences || {};
  return { ...defaults, ...saved };
}

// Finds the current user's display name by matching their email to a family_members record.
function getActorName() {
  if (!A.user) return 'A family member';
  const match = A.members.find(m =>
    m.email && m.email.toLowerCase() === A.user.email?.toLowerCase()
  );
  if (match) return match.name;
  return A.user.user_metadata?.name || 'A family member';
}

// Writes an activity notification to Supabase. Fire-and-forget.
function writeNotif(category, action, title, body, referenceId) {
  if (!A.family || !A.user || isSampleMode()) return;
  const prefs = getNotifPrefs();
  const prefKey = category === 'member' ? 'notif_member_join' : 'notif_' + category;
  if (prefs[prefKey] === false) return;
  const payload = {
    family_id: A.family.id,
    actor_user_id: A.user.id,
    actor_name: getActorName(),
    category,
    action,
    title: title || '',
    body: body || '',
    reference_id: referenceId || null,
  };
  sb.from('notifications').insert(payload).then(({ error }) => {
    if (error) console.warn('Notification write failed:', error.message);
  });
}

// Fetches activity notifications from Supabase (other members only, last 7 days)
async function loadNotifications() {
  if (!A.family || !A.user || isSampleMode()) return;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 7);
  // v22.1 fix: this background poll (setInterval, every 60s) previously
  // called sb.from(...) directly — no timeout, no retry, and no try/catch
  // around the await itself. If the connection was in a bad state, this
  // would throw an uncaught promise rejection every single poll cycle,
  // forever, even while the person wasn't doing anything else in the app —
  // matching exactly the repeating "Uncaught (in promise) Error" console
  // spam reported during testing. Now routed through the same sbWrite()
  // timeout/retry wrapper every other database call already uses, with
  // {silent:true} so a background poll never pops a "Connection issue…"
  // toast for something the user didn't initiate — plus a try/catch as a
  // last-resort safety net so this can never surface an unhandled
  // rejection either way.
  try {
    const { data, error } = await sbWrite(() => sb.from('notifications')
      .select('*')
      .eq('family_id', A.family.id)
      .neq('actor_user_id', A.user.id)
      .gte('created_at', cutoff.toISOString())
      .order('created_at', { ascending: false })
      .limit(50), { silent: true });
    if (error) { console.warn('Notifications load error:', error.message); return; }
    _notifications = data || [];
    refreshNotifBadge();
  } catch (e) {
    console.warn('Notifications load failed:', e.message);
  }
}

// Computes real-time alerts from existing app data. No DB query needed.
function computeAlerts() {
  if (isSampleMode()) return [];
  const alerts = [];
  const prefs = getNotifPrefs();
  const today = todayD();
  const now = new Date();

  // Low stock medications (≤ 7 days of supply remaining)
  // v17 fix: now reads via the shared effMedDaysLeft() helper (also used by
  // the Meds table badge in renderMeds()) which is updated_stock-aware —
  // falls back to stock_today only when no order has ever been confirmed.
  // Previously this block only ever read stock_today, which never changes
  // after an order is confirmed (see confirmOrder()), so the alert kept
  // firing forever after ordering even once updated_stock was healthy.
  if (prefs.alert_low_stock !== false) {
    getDM().forEach(med => {
      const daysLeft = effMedDaysLeft(med);
      if (daysLeft === null) return;
      if (daysLeft <= 7) {
        const memberNames = A.members
          .filter(m => (med.member_ids || []).includes(m.id))
          .map(m => m.name).join(', ');
        alerts.push({
          icon: '💊',
          color: T.rose,
          title: `${med.name} running ${daysLeft <= 0 ? 'out' : 'low'}`,
          body: `${daysLeft <= 0 ? 'Out of stock' : `${daysLeft} day${daysLeft === 1 ? '' : 's'} left`}${memberNames ? ' · ' + memberNames : ''}`,
          id: 'low_stock_' + med.id,
        });
      }
    });
  }

  // Expiring inventory products (within 30 days)
  if (prefs.alert_expiring !== false) {
    (A.invProducts || []).forEach(p => {
      if (!p.expiry) return;
      const expDate = new Date(p.expiry);
      const daysUntil = Math.floor((expDate - now) / 86400000);
      if (daysUntil <= 30) {
        alerts.push({
          icon: daysUntil < 0 ? '🚨' : '⏰',
          color: daysUntil < 0 ? T.rose : T.honey,
          title: `${p.name} ${daysUntil < 0 ? 'expired' : 'expiring soon'}`,
          body: daysUntil < 0
            ? `Expired ${Math.abs(daysUntil)} day${Math.abs(daysUntil) === 1 ? '' : 's'} ago`
            : `Expires in ${daysUntil} day${daysUntil === 1 ? '' : 's'}`,
          id: 'expiry_' + p.id,
        });
      }
    });
  }

  // Overdue tasks with open action items
  if (prefs.alert_overdue !== false) {
    getEvents().filter(e => {
      if (e.type !== 'task' || e.completed_at) return false;
      const evDay = new Date(e.date); evDay.setHours(0, 0, 0, 0);
      return evDay < today && (e.actions || []).some(a => !a.done);
    }).forEach(e => {
      const openCount = (e.actions || []).filter(a => !a.done).length;
      alerts.push({
        icon: '⚠️',
        color: T.rose,
        title: `Overdue: ${e.title || 'Task'}`,
        body: `${openCount} open item${openCount !== 1 ? 's' : ''} · Due ${fmt(e.date)}`,
        id: 'overdue_' + e.id,
      });
    });
  }

  // Events starting within the next 60 minutes
  if (prefs.alert_event_start !== false) {
    const in60 = new Date(); in60.setMinutes(in60.getMinutes() + 60);
    getEvents().filter(e => {
      if (e.type === 'wellness' || e.all_day) return false;
      const start = new Date(e.date);
      return start > now && start <= in60;
    }).forEach(e => {
      const minsAway = Math.round((new Date(e.date) - now) / 60000);
      alerts.push({
        icon: '🔔',
        color: T.sky,
        title: `Starting soon: ${e.title || ET[e.type].label}`,
        body: `In ${minsAway} minute${minsAway === 1 ? '' : 's'}${e.location ? ' · ' + e.location : ''}`,
        id: 'soon_' + e.id,
      });
    });
  }

  return alerts;
}

// Returns the emoji icon for a notification row based on category + action
function notifIcon(category, action) {
  if (category === 'member') return '👤';
  if (action === 'deleted') return '🗑';
  if (action === 'created') {
    return { event:'🗓', note:'📓', shopping:'🛒', meal:'🍽', inventory_meds:'💊', inventory_products:'📦' }[category] || '🔔';
  }
  return { event:'✏️', note:'✏️', shopping:'✏️', meal:'🍽', inventory_meds:'💊', inventory_products:'📦' }[category] || '🔔';
}

// Updates the red badge on the bell icon.
// v22 (Pass F): shared unread-notifications check — was previously
// duplicated between refreshNotifBadge() and openProfileMenu(). Now the
// one canonical version; openProfileMenu() is retired this pass, and
// refreshNotifBadge() below is refactored to call this instead of
// repeating the same calculation inline.
function _hasUnreadNotifs() {
  const prefs = getNotifPrefs();
  const lastRead = parseInt(localStorage.getItem('ks_notif_last_read_' + (A.user?.id || '')) || '0');
  return _notifications.some(n => {
    const prefKey = n.category === 'member' ? 'notif_member_join' : 'notif_' + n.category;
    if (prefs[prefKey] === false) return false;
    return new Date(n.created_at).getTime() > lastRead;
  });
}

function refreshNotifBadge() {
  // v12: target renamed from #notif-badge (numeric badge on old bell) to
  // #profile-dot (plain dot on the new My Profile button). The unread-

// Saves a single notification preference key into families.notif_preferences (JSONB).
async function updateNotifPref(key, val) {
  if (!A.family) return;
  const prefs = { ...getNotifPrefs(), [key]: val };
  // v10 (UX hardening): sbWrite() for idle-safety. On failure, re-render
  // Settings so the toggle visually reverts to the last confirmed state —
  // previously it stayed checked on-screen even though the DB was never
  // updated, silently lying to the user.
  const { data, error } = await sbWrite(() => sb.from('families')
    .update({ notif_preferences: prefs })
    .eq('id', A.family.id)
    .select().single());
  if (error) { toast('Error saving preference.', true); console.error(error); _openNotifPrefsModal(); return; }
  A.family = data;
}
window.updateNotifPref = updateNotifPref;

// v20: Curated Content Library — Settings toggle. Mirrors updateNotifPref()'s
// structure (optimistic-feeling update, sbWrite(), revert + toast on failure).
async function toggleCuratedContent(key, val){
  if(!A.family)return;
  const topic=CURATED_CONTENT_LIBRARY.find(t=>t.key===key);
  if(!topic)return;
  const prefs={...(A.family.curated_content_prefs||{}), [key]:val};
  const{data,error}=await sbWrite(()=>sb.from('families')
    .update({curated_content_prefs:prefs})
    .eq('id',A.family.id)
    .select().single());
  if(error){toast('Error saving preference.',true);console.error(error);renderSettings();return;}
  A.family=data;

  if(val){
    // Turning ON. If the group already exists locally, nothing else to do —
    // it was never actually removed from the DB by a toggle-off.
    let grp=A.noteGroups.find(g=>g.curated_key===key);
    if(!grp){
      // Not in local state — either this is genuinely the first time ever
      // (no row in the DB yet), or it exists in the DB but was filtered out
      // of local state while hidden (a previous toggle-off, earlier this
      // session or a previous session). Check the DB before seeding fresh,
      // so re-enabling never creates a duplicate group+notes.
      const{data:existingGrp}=await sb.from('note_groups').select('*').eq('curated_key',key).maybeSingle();
      if(existingGrp){
        grp=existingGrp;
        A.noteGroups.push(grp);
        const{data:existingNotes}=await sb.from('notes').select('*').eq('group_id',grp.id);
        (existingNotes||[]).forEach(n=>{ if(!A.notes.some(x=>x.id===n.id)) A.notes.push(n); });
      } else {
        grp=await seedCuratedGroup(key); // genuinely first time — insert group+notes
        if(!grp){renderSettings();return;} // seeding failed — toast already shown
      }
    }
  } else {
    // Turning OFF: drop the group+notes from local state only — nothing is
    // deleted in the database, so toggling back on later is instant.
    const grp=A.noteGroups.find(g=>g.curated_key===key);
    if(grp){
      A.notes=A.notes.filter(n=>n.group_id!==grp.id);
      A.noteGroups=A.noteGroups.filter(g=>g.id!==grp.id);
      // If the hidden group was the one currently selected in the Notebook
      // ribbon, fall back to "All Notes" so the view doesn't point at a
      // group that no longer exists in local state.
      if(A.noteFGroup===grp.id) A.noteFGroup='all';
    }
  }
  renderNB();
  renderSettings();
}
window.toggleCuratedContent=toggleCuratedContent;

// Shared "find or create by name" helpers — reused by Quick Note (group
// "Quick Notes") and Quick Shopping Item (list "Quick Add"). Matches by
// exact name within the family; if one already exists (including one a
// user made manually for unrelated reasons) it's reused rather than
// duplicated, per spec §8.
async function getOrCreateGroup(name){
  const existing=(A.noteGroups||[]).find(g=>g.name===name);
  if(existing) return {data:existing, error:null};
  const{data,error}=await sbWrite(()=>sb.from('note_groups').insert({family_id:A.family.id,name}).select().single());
  if(!error && data) A.noteGroups.push(data);
  return {data,error};
}
async function getOrCreateList(name){
  const existing=(A.shoppingLists||[]).find(l=>l.name===name);
  if(existing) return {data:existing, error:null, limited:false};
  // Only creating a genuinely NEW list counts against the free-plan
  // Shopping Lists limit — reusing an existing "Quick Add" list never does,
  // matching how createShoppingList() only gates brand-new lists too.
  if(_isAtShoppingListLimit()) return {data:null, error:null, limited:true};
  const{data,error}=await sbWrite(()=>sb.from('shopping_lists').insert({family_id:A.family.id,name,items:[]}).select().single());
  if(!error && data) A.shoppingLists.push(data);
  return {data,error,limited:false};
}

// ── Quick Task ────────────────────────────────────────────────────────────────
function openQuickTask(){
  if(!A.family){toast('Set up your family first.',true);return;}
  // Same free-plan Events limit check openEvForm() already uses — Quick Add
  // creates a genuinely normal task event, so it must respect the same
  // limit rather than becoming an accidental way around it.
  if(_isAtEventLimit()){ _quickLimitModal('Events'); return; }
  const nowD=new Date();
  // v21 fix (found in staging testing): unlike the full Calendar form —
  // where truncating to the current hour is fine, since the person is
  // already looking at the form and can adjust it — Quick Add's whole
  // point is that people save the suggested defaults without checking
  // them. Truncating meant a task saved at 21:25 defaulted to 21:00,
  // already in the past, so it never showed in Home's Today section. This
  // genuinely rounds UP to the next full hour instead, rolling over to
  // tomorrow if it's currently past 23:00. Deliberately NOT applied to
  // openEvForm() itself — that's separate, established behavior elsewhere.
  let defHour=nowD.getHours()+1;
  let defDateD=nowD;
  if(defHour>=24){ defHour=0; defDateD=addDays(nowD,1); }
  const iDate=toISOLocal(defDateD);
  const defTime=String(defHour).padStart(2,'0')+':00';
  showModal('Quick Task', `
    <div class="form-row"><label class="lbl">Title *</label><input class="inp" id="qt-title" placeholder="Task title" autofocus></div>
    <div class="grid2">
      <div class="form-row" style="margin:0"><label class="lbl">Date</label><input class="inp" type="date" id="qt-date" value="${iDate}"></div>
      <div class="form-row" style="margin:0" id="qt-time-row"><label class="lbl">Time</label>${buildTimeSelect('qt-time', defTime)}</div>
    </div>
    <button class="btn btn-primary btn-full" onclick="saveQuickTask()">Add Task</button>`);
  setTimeout(()=>{ const el=document.getElementById('qt-title'); if(el){el.focus();} },80);
}

async function saveQuickTask(){
  if(!A.family){toast('Set up your family first.',true);return;}

  if(!title){toast('Please add a title.',true);return;}
  const dateStr=document.getElementById('qt-date')?.value;
  const timeStr=getTimeVal('qt-time')||'12:00';
  const date = dateStr ? localDT(dateStr,timeStr) : new Date().toISOString();
  // A completely normal task event — same columns as the full Calendar
  // form's Task save (saveEv()), just with every optional field left at
  // its blank/default value, per spec §4.
  const data={
    family_id:A.family.id, type:'task', title, date,
    end_date:null, all_day:false, participants:[], participants_all_family:false, location:null,
    links:[], actions:[], tags:[], description:null,
    recurrence:'None', recurrence_end_type:null, recurrence_end_count:null, recurrence_end_date:null,
    is_private:false, created_by_user_id:A.user?.id||null,
    updated_at:new Date().toISOString(), updated_by_name:getActorName(), updated_scope:null,
  };
  const _saveBtn=document.querySelector('.modal-body button.btn-primary');
  if(_saveBtn){_saveBtn.disabled=true;_saveBtn.dataset.origText=_saveBtn.textContent;_saveBtn.textContent='Adding…';_saveBtn.style.opacity='0.7';}
  showSavingToast();
  let _saveOk=false;
  try{
    const{data:result,error}=await sbWrite(()=>sb.from('events').insert(data).select().single());
    if(error){toast('Error adding task.',true);console.error(error);return;}
    A.events.push(result);
    _saveOk=true;
    closeModal();toast('Task added! ✅');
    renderPage();
  }catch(e){
    toast('Something went wrong — please try again.',true);console.error(e);
  }finally{
    hideSavingToast();
    if(!_saveOk&&_saveBtn){_saveBtn.disabled=false;_saveBtn.textContent=_saveBtn.dataset.origText||'Add Task';_saveBtn.style.opacity='';}
  }
